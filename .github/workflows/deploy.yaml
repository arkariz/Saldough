name: Shorebird Pipeline (Release/Patch)

run-name: ${{ inputs.action_type == 'release' && '🚀 Release' || '🩹 Patch' }} ${{ github.ref_name }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose action (release or patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - release
          - patch
      patch_number:
        description: 'Nomor pembaruan kecil (hanya untuk patch): nomor Shorebird berikutnya untuk rilis ini, mis. 1 untuk patch pertama. Catatannya di release_notes/<build>-<nomor>.json'
        required: false
        default: '0'
        type: string
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.47.5'
        type: string

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 0. CATATAN "APA YANG BARU" (ADR-039 §3.3) ---
      # Wajib ada untuk setiap build yang dipublikasikan; diperiksa SEBELUM
      # build panjang dan diterbitkan ke Remote Config SEBELUM rilis/patch,
      # supaya perangkat sudah memegangnya saat versi baru tiba.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Need file package-lock.json in repositori

      - name: Install Node Dependencies
        run: npm ci

      - name: Determine build and patch number
        id: meta
        run: |
          BUILD=$(sed -n 's/^version:[[:space:]]*[^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          if [ "${{ github.event.inputs.action_type }}" = "patch" ]; then
            PATCH="${{ github.event.inputs.patch_number }}"
            if [ -z "$PATCH" ] || [ "$PATCH" = "0" ]; then
              echo "patch_number wajib diisi (>= 1) untuk patch" >&2
              exit 1
            fi
          else
            PATCH=0
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      - name: Test release notes script
        run: npm test

      - name: Validate release notes
        run: node scripts/release_notes.js validate --build ${{ steps.meta.outputs.build }} --patch ${{ steps.meta.outputs.patch }}

      - name: Publish release notes to Firebase Remote Config
        id: publish_notes
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/release_notes.js publish

      # --- 1. SETUP BUILD ENVIRONTMENT (WITH CACHE) ---
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Cache Android NDK & CMake
        uses: actions/cache@v3
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ${{ runner.os }}-android-ndk-cmake-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-cmake-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.local/share/pub-cache/hosted
            ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true
          working-directory: android

      # # --- 2. SHOREBIRD & FASTLANE EXECUTION ---
      - name: Setup Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/upload-keystore.jks

          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Create Play Store Credential For Fastlane
        env:
          PLAY_STORE_JSON: ${{ secrets.FASTLANE_ANDROID_SERVICE_ACCOUNT }}
        working-directory: android/fastlane
        run: echo "$PLAY_STORE_JSON" > fastlane-android-service-account.json

      - name: Fastlane - Shorebird Release to Play Store
        if: github.event.inputs.action_type == 'release'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        working-directory: android
        run: bundle exec fastlane android release_internal

      - name: Fastlane - Shorebird Patch
        if: github.event.inputs.action_type == 'patch'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        working-directory: android
        run: bundle exec fastlane android patch_ota
    
    # --- 3. PEMBERSIHAN BILA GAGAL ---
      # Rilis/patch gagal: hapus entri catatan eksekusi ini (sebisanya). Sisa
      # yang yatim dibersihkan sinkronisasi eksekusi berikutnya.
      - name: Remove release note entry if the run failed
        if: failure() && steps.publish_notes.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/release_notes.js cleanup --build ${{ steps.meta.outputs.build }} --patch ${{ steps.meta.outputs.patch }}
