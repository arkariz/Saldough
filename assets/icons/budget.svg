<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Budget Icon: Target / Pie Chart / Planned Budget Box -->
  <!-- Outline -->
  <rect x="5" y="5" width="22" height="22" rx="0" fill="#1E1B19"/>
  <!-- Base Container -->
  <rect x="6" y="6" width="20" height="20" fill="#F4ECE8"/>
  <!-- Target Circles / Segments -->
  <rect x="8" y="8" width="16" height="16" fill="#15803D"/>
  <rect x="9" y="9" width="14" height="14" fill="#16A34A"/>
  <!-- Pie / Quarter segments -->
  <rect x="9" y="9" width="6" height="6" fill="#4ADE80"/>
  <rect x="17" y="9" width="6" height="6" fill="#22C55E"/>
  <rect x="9" y="17" width="6" height="6" fill="#15803D"/>
  <!-- Center Bullseye / Coin Highlight -->
  <rect x="13" y="13" width="6" height="6" fill="#1E1B19"/>
  <rect x="14" y="14" width="4" height="4" fill="#FACC15"/>
  <rect x="15" y="15" width="2" height="2" fill="#FEF08A"/>
</svg>