<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Coffee Mug Icon: Warm Terracotta Mug with Steam Pixels -->
  <!-- Rising Steam Pixels -->
  <rect x="10" y="4" width="2" height="3" fill="#D6D3D1"/>
  <rect x="12" y="6" width="2" height="2" fill="#E7E5E4"/>
  <rect x="15" y="3" width="2" height="3" fill="#D6D3D1"/>
  <rect x="17" y="5" width="2" height="2" fill="#E7E5E4"/>
  <!-- Mug Rim & Liquid -->
  <rect x="7" y="10" width="15" height="16" fill="#1E1B19"/>
  <rect x="8" y="11" width="13" height="14" fill="#C2410C"/>
  <rect x="8" y="11" width="13" height="2" fill="#FB923C"/>
  <!-- Coffee Liquid Inset -->
  <rect x="9" y="11" width="11" height="2" fill="#451A03"/>
  <rect x="10" y="11" width="4" height="1" fill="#78350F"/>
  <!-- Mug Handle -->
  <rect x="21" y="13" width="6" height="9" fill="#1E1B19"/>
  <rect x="23" y="15" width="2" height="5" fill="#none"/>
  <rect x="22" y="14" width="3" height="7" fill="#EA580C"/>
  <rect x="22" y="16" width="1" height="3" fill="#FFF8F5"/>
  <!-- Saucer Plate -->
  <rect x="5" y="25" width="20" height="3" fill="#1E1B19"/>
  <rect x="6" y="26" width="18" height="1" fill="#E0D8D5"/>
</svg>
