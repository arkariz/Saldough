  <polygon points="16,5 28,11 16,17 4,11" fill="#1E1B19"/>
  <polygon points="16,6 26,11 16,16 6,11" fill="#1E293B"/>
  <polygon points="16,7 24,11 16,15 8,11" fill="#44403C"/>
  <!-- Center Cap Button & Gold Tassel -->
  <rect x="15" y="10" width="2" height="2" fill="#FACC15"/>
  <rect x="17" y="11" width="5" height="1" fill="#FACC15"/>
  <rect x="22" y="12" width="2" height="6" fill="#FACC15"/>
  <rect x="21" y="17" width="4" height="3" fill="#EAB308"/>
  <!-- Skullcap / Lower Hat Headband -->
  <rect x="9" y="15" width="14" height="8" fill="#1E1B19"/>
  <rect x="10" y="16" width="12" height="6" fill="#0F172A"/>
  <rect x="10" y="16" width="12" height="1" fill="#57534E"/>
  <!-- Book Spine Base (Diploma Foundation) -->
  <rect x="7" y="24" width="18" height="3" fill="#1E1B19"/>
  <rect x="8" y="25" width="16" height="2" fill="#16A34A"/>
