<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Electricity / Utilities Icon: Voxel Lightbulb with Glowing Core -->
  <!-- Bulb Glass Top -->
  <rect x="10" y="4" width="12" height="12" fill="#1E1B19"/>
  <rect x="11" y="5" width="10" height="10" fill="#FACC15"/>
  <rect x="12" y="5" width="8" height="2" fill="#FEF08A"/>
  <rect x="12" y="7" width="3" height="4" fill="#FFFFFF"/>
  <!-- Glow Filaments in Center -->
  <rect x="14" y="9" width="4" height="4" fill="#EAB308"/>
  <rect x="15" y="10" width="2" height="2" fill="#CA8A04"/>
  <!-- Tapered Neck -->
  <rect x="12" y="15" width="8" height="5" fill="#1E1B19"/>
  <rect x="13" y="15" width="6" height="4" fill="#EAB308"/>
  <!-- Screw Base (Metal Slate) -->
  <rect x="12" y="19" width="8" height="6" fill="#1E1B19"/>
  <rect x="13" y="20" width="6" height="4" fill="#A8A29E"/>
  <rect x="13" y="21" width="6" height="1" fill="#57534E"/>
  <rect x="13" y="23" width="6" height="1" fill="#57534E"/>
  <!-- Contact Point at Bottom -->
  <rect x="14" y="25" width="4" height="3" fill="#1E1B19"/>
  <rect x="15" y="25" width="2" height="2" fill="#44403C"/>
  <!-- Sparkle Rays around Bulb -->
  <rect x="6" y="9" width="2" height="2" fill="#FACC15"/>
  <rect x="24" y="9" width="2" height="2" fill="#FACC15"/>
  <rect x="15" y="1" width="2" height="2" fill="#FACC15"/>
</svg>
