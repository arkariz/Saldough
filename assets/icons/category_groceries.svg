<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Grocery Basket Icon: Brown woven voxel basket with fresh produce -->
  <!-- Basket Handle -->
  <rect x="13" y="4" width="6" height="2" fill="#1E1B19"/>
  <rect x="14" y="5" width="4" height="1" fill="#D97706"/>
  <rect x="11" y="6" width="3" height="6" fill="#1E1B19"/>
  <rect x="12" y="6" width="1" height="5" fill="#D97706"/>
  <rect x="18" y="6" width="3" height="6" fill="#1E1B19"/>
  <rect x="19" y="6" width="1" height="5" fill="#B45309"/>
  <!-- Produce: Red Apple & Green Celery sticking out -->
  <rect x="10" y="8" width="5" height="5" fill="#1E1B19"/>
  <rect x="11" y="9" width="3" height="3" fill="#DC2626"/>
  <rect x="12" y="8" width="1" height="1" fill="#22C55E"/>
  <rect x="16" y="7" width="5" height="6" fill="#1E1B19"/>
  <rect x="17" y="8" width="3" height="4" fill="#22C55E"/>
  <rect x="18" y="8" width="1" height="3" fill="#4ADE80"/>
