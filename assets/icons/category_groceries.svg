  <!-- Basket Woven Body Fill -->
  <rect x="7" y="13" width="18" height="13" fill="#B45309"/>
  <rect x="7" y="13" width="18" height="2" fill="#F59E0B"/>
  <!-- Weave Texture (Voxel Blocks) -->
  <rect x="9" y="16" width="3" height="3" fill="#92400E"/>
  <rect x="15" y="16" width="3" height="3" fill="#92400E"/>
  <rect x="21" y="16" width="3" height="3" fill="#92400E"/>
  <rect x="12" y="20" width="3" height="3" fill="#78350F"/>
  <rect x="18" y="20" width="3" height="3" fill="#78350F"/>
</svg>
