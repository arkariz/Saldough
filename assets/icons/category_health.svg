<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Health / Medical Kit Icon: Clean White Voxel First Aid Box with Red Cross -->
  <!-- Kit Body Outline -->
  <rect x="6" y="8" width="20" height="17" fill="#1E1B19"/>
  <!-- Kit Handle -->
  <rect x="12" y="5" width="8" height="4" fill="#1E1B19"/>
  <rect x="14" y="6" width="4" height="2" fill="#none"/>
  <rect x="13" y="6" width="6" height="1" fill="#D6D3D1"/>
  <!-- Kit Box Fill (Clean Off-White) -->
  <rect x="7" y="9" width="18" height="15" fill="#FFF8F5"/>
  <rect x="7" y="9" width="18" height="2" fill="#FFFFFF"/>
  <rect x="7" y="21" width="18" height="3" fill="#E0D8D5"/>
  <!-- Red Cross Emblem in Center -->
  <rect x="14" y="12" width="4" height="10" fill="#DC2626"/>
  <rect x="11" y="15" width="10" height="4" fill="#DC2626"/>
  <rect x="15" y="13" width="2" height="8" fill="#DC2626"/>
  <rect x="12" y="16" width="8" height="2" fill="#DC2626"/>
  <rect x="14" y="12" width="4" height="1" fill="#FCA5A5"/>
  <!-- Latches -->
  <rect x="9" y="11" width="2" height="2" fill="#A8A29E"/>
  <rect x="21" y="11" width="2" height="2" fill="#A8A29E"/>
</svg>
