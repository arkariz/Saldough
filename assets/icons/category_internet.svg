<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Internet / Wi-Fi Router Icon: Voxel Router with Dual Antennas and LED Signals -->
  <!-- Antennas (Left and Right) -->
  <rect x="7" y="4" width="2" height="11" fill="#1E1B19"/>
  <rect x="7" y="5" width="1" height="9" fill="#78716C"/>
  <rect x="23" y="4" width="2" height="11" fill="#1E1B19"/>
  <rect x="23" y="5" width="1" height="9" fill="#78716C"/>
  <!-- Router Body Upper Tier -->
  <rect x="5" y="15" width="22" height="10" fill="#1E1B19"/>
  <rect x="6" y="16" width="20" height="8" fill="#44403C"/>
  <rect x="6" y="16" width="20" height="2" fill="#78716C"/>
  <!-- Status LEDs (Emerald Active Signal Dots) -->
  <rect x="9" y="20" width="2" height="2" fill="#22C55E"/>
  <rect x="13" y="20" width="2" height="2" fill="#22C55E"/>
  <rect x="17" y="20" width="2" height="2" fill="#60A5FA"/>
  <rect x="21" y="20" width="2" height="2" fill="#22C55E"/>
  <!-- Wi-Fi Wave Broadcast Pixels (Upper Center) -->
  <rect x="14" y="6" width="4" height="2" fill="#2563EB"/>
  <rect x="12" y="9" width="8" height="2" fill="#60A5FA"/>
  <rect x="15" y="12" width="2" height="2" fill="#7DD3FC"/>
  <!-- Base Stand Feet -->
  <rect x="7" y="25" width="4" height="2" fill="#1E1B19"/>
  <rect x="21" y="25" width="4" height="2" fill="#1E1B19"/>
</svg>
