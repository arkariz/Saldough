<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Investment / Stock Chart Icon: Voxel Bar Growth Chart with Golden Upward Trend Line -->
  <!-- Chart Axes Base -->
  <rect x="4" y="6" width="2" height="20" fill="#1E1B19"/>
  <rect x="4" y="24" width="24" height="2" fill="#1E1B19"/>
  <!-- Bar 1 (Low, Cyan) -->
  <rect x="8" y="18" width="4" height="7" fill="#1E1B19"/>
  <rect x="9" y="19" width="2" height="5" fill="#2563EB"/>
  <rect x="9" y="19" width="2" height="1" fill="#60A5FA"/>
  <!-- Bar 2 (Medium, Emerald) -->
  <rect x="14" y="13" width="4" height="12" fill="#1E1B19"/>
  <rect x="15" y="14" width="2" height="10" fill="#16A34A"/>
  <rect x="15" y="14" width="2" height="1" fill="#4ADE80"/>
  <!-- Bar 3 (High, Gold/Emerald) -->
  <rect x="20" y="8" width="4" height="17" fill="#1E1B19"/>
  <rect x="21" y="9" width="2" height="15" fill="#22C55E"/>
  <rect x="21" y="9" width="2" height="1" fill="#6EE7B7"/>
  <!-- Upward Trend Arrow (Gold) -->
  <rect x="7" y="15" width="3" height="2" fill="#FACC15"/>
  <rect x="10" y="13" width="4" height="2" fill="#FACC15"/>
  <rect x="14" y="10" width="4" height="2" fill="#FACC15"/>
  <rect x="18" y="7" width="4" height="2" fill="#FACC15"/>
  <rect x="22" y="4" width="5" height="5" fill="#1E1B19"/>
  <rect x="23" y="5" width="3" height="3" fill="#FACC15"/>
  <rect x="24" y="5" width="1" height="1" fill="#FFFFFF"/>
</svg>
