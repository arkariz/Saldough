<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Shopping Bag Icon: Warm Ochre Paper/Tote Bag with Fold creases -->
  <!-- Rope Handles -->
  <rect x="11" y="4" width="3" height="7" fill="#1E1B19"/>
  <rect x="12" y="5" width="1" height="5" fill="#FACC15"/>
  <rect x="18" y="4" width="3" height="7" fill="#1E1B19"/>
  <rect x="19" y="5" width="1" height="5" fill="#FACC15"/>
  <rect x="13" y="4" width="6" height="2" fill="#1E1B19"/>
  <rect x="13" y="5" width="6" height="1" fill="#FACC15"/>
  <!-- Bag Body Outline -->
  <rect x="6" y="10" width="20" height="18" fill="#1E1B19"/>
  <!-- Bag Body Fill (Warm Ochre / Kraft) -->
  <rect x="7" y="11" width="18" height="16" fill="#D97706"/>
  <rect x="7" y="11" width="18" height="2" fill="#FDE68A"/>
  <!-- Side Fold Shadow (Isometric Depth) -->
  <rect x="19" y="11" width="6" height="16" fill="#B45309"/>
  <!-- Center Star / Heart Pixel Accent -->
  <rect x="12" y="17" width="4" height="4" fill="#FEF3C7"/>
  <rect x="13" y="16" width="2" height="6" fill="#FEF3C7"/>
  <!-- Bottom crease -->
  <rect x="7" y="25" width="18" height="2" fill="#92400E"/>
</svg>
