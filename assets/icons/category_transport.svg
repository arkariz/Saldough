<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Transportation / Car Icon: Compact Voxel Emerald City Car -->
  <!-- Cabin Roof & Windshield -->
  <rect x="10" y="7" width="13" height="8" fill="#1e1e1e"/>
  <rect x="11" y="8" width="11" height="6" fill="#047857"/>
  <rect x="11" y="8" width="11" height="1" fill="#10b981"/>
  <!-- Windows (Cyan Glass) -->
  <rect x="12" y="9" width="4" height="4" fill="#38bdf8"/>
  <rect x="13" y="9" width="1" height="2" fill="#e0f2fe"/>
  <rect x="17" y="9" width="5" height="4" fill="#0284c7"/>
  <rect x="18" y="9" width="1" height="2" fill="#bae6fd"/>
  <!-- Car Lower Body -->
  <rect x="5" y="14" width="23" height="9" fill="#1e1e1e"/>
  <rect x="6" y="15" width="21" height="7" fill="#059669"/>
  <rect x="6" y="15" width="21" height="2" fill="#34d399"/>
  <rect x="6" y="19" width="21" height="3" fill="#047857"/>
  <!-- Headlight (Yellow) & Taillight (Red) -->
  <rect x="26" y="16" width="2" height="3" fill="#facc15"/>
  <rect x="5" y="16" width="2" height="3" fill="#ef4444"/>
  <!-- Front and Rear Wheels -->
  <rect x="8" y="21" width="5" height="6" fill="#1e1e1e"/>
  <rect x="9" y="22" width="3" height="4" fill="#475569"/>
  <rect x="10" y="23" width="1" height="2" fill="#cbd5e1"/>

  <rect x="20" y="21" width="5" height="6" fill="#1e1e1e"/>
  <rect x="21" y="22" width="3" height="4" fill="#475569"/>
  <rect x="22" y="23" width="1" height="2" fill="#cbd5e1"/>
</svg>