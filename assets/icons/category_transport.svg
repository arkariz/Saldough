<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Transportation / Car Icon: Compact Voxel Emerald City Car -->
  <!-- Cabin Roof & Windshield -->
  <rect x="10" y="7" width="13" height="8" fill="#1E1B19"/>
  <rect x="11" y="8" width="11" height="6" fill="#15803D"/>
  <rect x="11" y="8" width="11" height="1" fill="#22C55E"/>
  <!-- Windows (Cyan Glass) -->
  <rect x="12" y="9" width="4" height="4" fill="#60A5FA"/>
  <rect x="13" y="9" width="1" height="2" fill="#DBEAFE"/>
  <rect x="17" y="9" width="5" height="4" fill="#2563EB"/>
  <rect x="18" y="9" width="1" height="2" fill="#BFDBFE"/>
  <!-- Car Lower Body -->
  <rect x="5" y="14" width="23" height="9" fill="#1E1B19"/>
  <rect x="6" y="15" width="21" height="7" fill="#16A34A"/>
  <rect x="6" y="15" width="21" height="2" fill="#4ADE80"/>
  <rect x="6" y="19" width="21" height="3" fill="#15803D"/>
  <!-- Headlight (Yellow) & Taillight (Red) -->
  <rect x="26" y="16" width="2" height="3" fill="#FACC15"/>
  <rect x="5" y="16" width="2" height="3" fill="#DC2626"/>
  <!-- Front and Rear Wheels -->
  <rect x="8" y="21" width="5" height="6" fill="#1E1B19"/>
  <rect x="9" y="22" width="3" height="4" fill="#57534E"/>
  <rect x="10" y="23" width="1" height="2" fill="#D6D3D1"/>

  <rect x="20" y="21" width="5" height="6" fill="#1E1B19"/>
  <rect x="21" y="22" width="3" height="4" fill="#57534E"/>
  <rect x="22" y="23" width="1" height="2" fill="#D6D3D1"/>
</svg>