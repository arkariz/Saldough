<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Expense Icon: Red Outgoing Arrow and Gold Coin Leaving Wallet -->
  <!-- Wallet base at bottom -->
  <rect x="7" y="19" width="18" height="10" fill="#1E1B19"/>
  <rect x="8" y="20" width="16" height="8" fill="#854D0E"/>
  <rect x="8" y="20" width="16" height="2" fill="#A16207"/>
  <rect x="8" y="25" width="16" height="3" fill="#713F12"/>
  <!-- Wallet Clasp -->
  <rect x="7" y="22" width="6" height="4" fill="#1E1B19"/>
  <rect x="8" y="23" width="4" height="2" fill="#FACC15"/>
  <!-- Outgoing Red Arrow pointing upward out of wallet -->
  <rect x="15" y="4" width="2" height="2" fill="#1E1B19"/>
  <rect x="14" y="5" width="4" height="2" fill="#1E1B19"/>
  <rect x="13" y="6" width="6" height="2" fill="#1E1B19"/>
  <rect x="12" y="7" width="8" height="2" fill="#1E1B19"/>
  <rect x="14" y="9" width="4" height="7" fill="#1E1B19"/>
  <!-- Red arrow fill with highlight -->
  <rect x="15" y="5" width="2" height="1" fill="#FCA5A5"/>
  <rect x="14" y="6" width="4" height="1" fill="#DC2626"/>
  <rect x="13" y="7" width="6" height="1" fill="#DC2626"/>
  <rect x="15" y="8" width="2" height="7" fill="#DC2626"/>
  <!-- Floating Gold Coin ejecting right -->
  <rect x="20" y="7" width="7" height="6" fill="#1E1B19"/>
  <rect x="21" y="8" width="5" height="4" fill="#FACC15"/>
  <rect x="22" y="8" width="3" height="2" fill="#FEF08A"/>
  <rect x="23" y="10" width="2" height="1" fill="#CA8A04"/>
  <!-- Trail / minus particles -->
  <rect x="8" y="11" width="3" height="1" fill="#DC2626"/>
</svg>