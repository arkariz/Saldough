<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Hourly Rate Icon: Stopwatch / Clock with Gold Coin Center -->
  <!-- Stopwatch Top Button / Crown -->
  <rect x="14" y="3" width="4" height="3" fill="#1e1e1e"/>
  <rect x="15" y="4" width="2" height="2" fill="#94a3b8"/>
  <!-- Main Clock Frame -->
  <rect x="5" y="6" width="22" height="22" fill="#1e1e1e"/>
  <rect x="6" y="7" width="20" height="20" fill="#475569"/>
  <rect x="7" y="8" width="18" height="18" fill="#fff8f5"/>
  <!-- Clock Inner Ring -->
  <rect x="7" y="8" width="18" height="2" fill="#f4ece8"/>
  <rect x="7" y="24" width="18" height="2" fill="#e0d8d5"/>
  <!-- Center Gold Coin ($/Rp Hourly Rate Symbol) -->
  <rect x="11" y="12" width="10" height="10" fill="#1e1e1e"/>
  <rect x="12" y="13" width="8" height="8" fill="#facc15"/>
  <rect x="13" y="13" width="6" height="2" fill="#fef08a"/>
  <!-- Currency Tick in Center -->
  <rect x="15" y="15" width="2" height="5" fill="#ca8a04"/>
  <rect x="14" y="16" width="4" height="1" fill="#ca8a04"/>
  <rect x="14" y="18" width="4" height="1" fill="#ca8a04"/>
</svg>
