<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Income Icon: Emerald Arrow & Gold Coin Entering Wallet -->
  <!-- Wallet base at bottom -->
  <rect x="7" y="19" width="18" height="10" fill="#1e1e1e"/>
  <rect x="8" y="20" width="16" height="8" fill="#854d0e"/>
  <rect x="8" y="20" width="16" height="2" fill="#a16207"/>
  <rect x="8" y="25" width="16" height="3" fill="#713f12"/>
  <!-- Wallet Clasp -->
  <rect x="19" y="22" width="6" height="4" fill="#1e1e1e"/>
  <rect x="20" y="23" width="4" height="2" fill="#facc15"/>
  <!-- Rising / Incoming Green Arrow (Pointing Downward into Wallet / Upward Flow) -->
  <!-- Arrow Head pointing down into wallet opening -->
  <rect x="14" y="14" width="4" height="2" fill="#1e1e1e"/>
  <rect x="13" y="13" width="6" height="2" fill="#1e1e1e"/>
  <rect x="12" y="12" width="8" height="2" fill="#1e1e1e"/>
  <rect x="14" y="7" width="4" height="6" fill="#1e1e1e"/>
  <!-- Green fill with highlight -->
  <rect x="15" y="8" width="2" height="6" fill="#10b981"/>
  <rect x="14" y="12" width="4" height="1" fill="#10b981"/>
  <rect x="13" y="13" width="6" height="1" fill="#34d399"/>
  <rect x="15" y="14" width="2" height="1" fill="#a7f3d0"/>
  <!-- Floating Gold Coin entering -->
  <rect x="8" y="4" width="7" height="6" fill="#1e1e1e"/>
  <rect x="9" y="5" width="5" height="4" fill="#facc15"/>
  <rect x="10" y="5" width="3" height="2" fill="#fef08a"/>
  <rect x="11" y="7" width="2" height="1" fill="#ca8a04"/>
  <!-- Sparkle plus top right -->
  <rect x="22" y="4" width="3" height="1" fill="#10b981"/>
  <rect x="23" y="3" width="1" height="3" fill="#10b981"/>
</svg>