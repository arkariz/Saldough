<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Freelance Invoice Document Icon -->
  <rect x="7" y="4" width="18" height="24" fill="#1e1e1e"/>
  <!-- Document Sheet Fill -->
  <rect x="8" y="5" width="16" height="22" fill="#fff8f5"/>
  <rect x="20" y="5" width="4" height="22" fill="#e0d8d5"/>
  <!-- Invoice Header Banner (Terracotta Ochre) -->
  <rect x="10" y="7" width="12" height="4" fill="#d97706"/>
  <rect x="11" y="8" width="5" height="2" fill="#fef3c7"/>
  <!-- Invoice Rows / Bill Items -->
  <rect x="10" y="13" width="8" height="2" fill="#334155"/>
  <rect x="19" y="13" width="3" height="2" fill="#059669"/>
  <rect x="10" y="17" width="7" height="2" fill="#334155"/>
  <rect x="19" y="17" width="3" height="2" fill="#059669"/>
  <!-- Total Summary Divider & Highlight Row -->
  <rect x="10" y="21" width="12" height="1" fill="#cbd5e1"/>
  <rect x="10" y="23" width="5" height="2" fill="#1e1e1e"/>
  <rect x="17" y="23" width="5" height="2" fill="#ea580c"/>
</svg>
