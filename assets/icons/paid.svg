<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Paid Payment Icon: Invoice / Receipt with Emerald Checkmark Seal & Gold Coin -->
  <!-- Invoice in Background -->
  <rect x="5" y="4" width="16" height="20" fill="#1e1e1e"/>
  <rect x="6" y="5" width="14" height="18" fill="#fff8f5"/>
  <!-- Invoice Rows -->
  <rect x="8" y="7" width="10" height="3" fill="#059669"/>
  <rect x="8" y="12" width="6" height="2" fill="#475569"/>
  <rect x="8" y="16" width="4" height="2" fill="#475569"/>
  <!-- Paid Emerald Badge Seal Overlay at Lower Right -->
  <rect x="15" y="15" width="12" height="12" fill="#1e1e1e"/>
  <rect x="16" y="16" width="10" height="10" fill="#10b981"/>
  <rect x="17" y="16" width="8" height="1" fill="#34d399"/>
  <rect x="16" y="25" width="10" height="1" fill="#047857"/>
  <!-- Bold White Pixel Checkmark -->
  <rect x="18" y="21" width="2" height="3" fill="#ffffff"/>
  <rect x="20" y="22" width="2" height="3" fill="#ffffff"/>
  <rect x="22" y="19" width="2" height="4" fill="#ffffff"/>
  <rect x="24" y="17" width="2" height="3" fill="#ffffff"/>
</svg>