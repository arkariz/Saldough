<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Pending Payment Icon: Invoice / Receipt with Clock Waiting Badge -->
  <!-- Invoice in Background -->
  <rect x="5" y="4" width="16" height="20" fill="#1e1e1e"/>
  <rect x="6" y="5" width="14" height="18" fill="#fff8f5"/>
  <!-- Invoice Rows -->
  <rect x="8" y="7" width="10" height="3" fill="#f59e0b"/>
  <rect x="8" y="12" width="7" height="2" fill="#475569"/>
  <rect x="8" y="16" width="5" height="2" fill="#475569"/>
  <!-- Pending Clock Badge Overlay at Lower Right -->
  <rect x="15" y="15" width="12" height="12" fill="#1e1e1e"/>
  <rect x="16" y="16" width="10" height="10" fill="#fef3c7"/>
  <rect x="17" y="16" width="8" height="1" fill="#ffffff"/>
  <!-- Clock Inner Ring -->
  <rect x="16" y="16" width="1" height="10" fill="#fde68a"/>
  <rect x="25" y="16" width="1" height="10" fill="#f59e0b"/>
  <rect x="16" y="25" width="10" height="1" fill="#d97706"/>
  <!-- Amber Pending Clock Hands -->
  <rect x="20" y="18" width="2" height="4" fill="#d97706"/>
  <rect x="20" y="20" width="3" height="2" fill="#d97706"/>
  <rect x="20" y="20" width="2" height="2" fill="#b45309"/>
</svg>