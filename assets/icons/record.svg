<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Catat Icon: Blocky Notebook + Gold/Emerald Pencil -->
  <!-- Notebook Back cover / outline -->
  <rect x="5" y="5" width="18" height="23" fill="#1e1e1e"/>
  <!-- Notebook Spine & Binding Rings -->
  <rect x="5" y="5" width="4" height="23" fill="#064e3b"/>
  <rect x="7" y="8" width="3" height="2" fill="#e0d8d5"/>
  <rect x="7" y="14" width="3" height="2" fill="#e0d8d5"/>
  <rect x="7" y="20" width="3" height="2" fill="#e0d8d5"/>
  <!-- Notebook Cover (Emerald Green) -->
  <rect x="9" y="6" width="13" height="21" fill="#059669"/>
  <!-- Inner Page Peak / Highlight -->
  <rect x="11" y="8" width="9" height="17" fill="#fff8f5"/>
  <!-- Ruled Pixel lines on Page -->
  <rect x="13" y="11" width="5" height="1" fill="#cbd5e1"/>
  <rect x="13" y="14" width="5" height="1" fill="#cbd5e1"/>
  <rect x="13" y="17" width="5" height="1" fill="#cbd5e1"/>
  <!-- Plus Emblem on Book Cover -->
  <rect x="14" y="20" width="3" height="1" fill="#047857"/>
  <rect x="15" y="19" width="1" height="3" fill="#047857"/>

  <!-- Pixel Pencil (Diagonal / Voxel angle) -->
  <!-- Pencil shadow / outline -->
  <polygon points="19,16 27,8 30,11 22,19" fill="#1e1e1e"/>
  <!-- Pencil Shaft (Warm Yellow / Gold) -->
  <polygon points="20,16 27,9 29,11 22,18" fill="#eab308"/>
  <polygon points="21,16 27,10 28,11 22,17" fill="#facc15"/>
  <!-- Eraser & Ferrule -->
  <polygon points="26,7 28,5 31,8 29,10" fill="#1e1e1e"/>
  <polygon points="27,7 28,6 30,8 29,9" fill="#ef4444"/>
  <rect x="27" y="7" width="1" height="2" fill="#94a3b8"/>
  <!-- Pencil Tip / Graphite -->
  <polygon points="17,19 20,16 22,18" fill="#1e1e1e"/>
  <polygon points="18,18 20,16 21,17" fill="#d97706"/>
  <rect x="16" y="19" width="2" height="2" fill="#1e1e1e"/>
</svg>