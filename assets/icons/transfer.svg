<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Transfer Icon: Two Wallets with Opposing Blue/Teal Transfer Arrows -->
  <!-- Left mini wallet -->
  <rect x="3" y="11" width="11" height="12" fill="#1e1e1e"/>
  <rect x="4" y="12" width="9" height="10" fill="#854d0e"/>
  <rect x="4" y="12" width="9" height="2" fill="#a16207"/>
  <rect x="10" y="15" width="3" height="4" fill="#1e1e1e"/>
  <rect x="11" y="16" width="2" height="2" fill="#facc15"/>
  <!-- Right mini bank/wallet -->
  <rect x="18" y="11" width="11" height="12" fill="#1e1e1e"/>
  <rect x="19" y="12" width="9" height="10" fill="#0f766e"/>
  <rect x="19" y="12" width="9" height="2" fill="#14b8a6"/>
  <rect x="19" y="15" width="3" height="4" fill="#1e1e1e"/>
  <rect x="19" y="16" width="2" height="2" fill="#facc15"/>
  <!-- Top Arrow (Left to Right, Blue) -->
  <rect x="9" y="5" width="12" height="2" fill="#1e1e1e"/>
  <rect x="10" y="6" width="9" height="1" fill="#38bdf8"/>
  <rect x="18" y="4" width="4" height="4" fill="#1e1e1e"/>
  <rect x="19" y="5" width="2" height="2" fill="#0284c7"/>
  <rect x="21" y="6" width="2" height="1" fill="#38bdf8"/>
  <!-- Bottom Arrow (Right to Left, Slate Cyan) -->
  <rect x="11" y="25" width="12" height="2" fill="#1e1e1e"/>
  <rect x="13" y="25" width="9" height="1" fill="#38bdf8"/>
  <rect x="10" y="24" width="4" height="4" fill="#1e1e1e"/>
  <rect x="11" y="25" width="2" height="2" fill="#0284c7"/>
  <rect x="9" y="25" width="2" height="1" fill="#38bdf8"/>
</svg>