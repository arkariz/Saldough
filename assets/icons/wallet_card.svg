<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Bank / Payment Card Icon -->
  <rect x="4" y="8" width="24" height="16" fill="#1e1e1e"/>
  <!-- Card Face (Deep Teal / Emerald Slate) -->
  <rect x="5" y="9" width="22" height="14" fill="#0f766e"/>
  <rect x="5" y="9" width="22" height="2" fill="#14b8a6"/>
  <rect x="5" y="18" width="22" height="5" fill="#115e59"/>
  <!-- Magnetic Stripe / Top Accent -->
  <rect x="5" y="11" width="22" height="2" fill="#134e4a"/>
  <!-- Gold EMV Chip -->
  <rect x="8" y="14" width="5" height="4" fill="#1e1e1e"/>
  <rect x="9" y="15" width="3" height="2" fill="#facc15"/>
  <rect x="10" y="15" width="1" height="2" fill="#fde047"/>
  <rect x="9" y="16" width="3" height="1" fill="#ca8a04"/>
  <!-- Embossed Card Digits / Elements -->
  <rect x="8" y="20" width="3" height="1" fill="#ccfbf1"/>
  <rect x="12" y="20" width="3" height="1" fill="#ccfbf1"/>
  <rect x="16" y="20" width="3" height="1" fill="#ccfbf1"/>
  <rect x="20" y="17" width="5" height="4" fill="#1e1e1e"/>
  <rect x="21" y="18" width="3" height="2" fill="#2dd4bf"/>
</svg>