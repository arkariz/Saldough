<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Bank / Payment Card Icon -->
  <rect x="4" y="8" width="24" height="16" fill="#1E1B19"/>
  <!-- Card Face (Deep Teal / Emerald Slate) -->
  <rect x="5" y="9" width="22" height="14" fill="#1D4ED8"/>
  <rect x="5" y="9" width="22" height="2" fill="#3B82F6"/>
  <rect x="5" y="18" width="22" height="5" fill="#1E40AF"/>
  <!-- Magnetic Stripe / Top Accent -->
  <rect x="5" y="11" width="22" height="2" fill="#1E3A8A"/>
  <!-- Gold EMV Chip -->
  <rect x="8" y="14" width="5" height="4" fill="#1E1B19"/>
  <rect x="9" y="15" width="3" height="2" fill="#FACC15"/>
  <rect x="10" y="15" width="1" height="2" fill="#FDE047"/>
  <rect x="9" y="16" width="3" height="1" fill="#CA8A04"/>
  <!-- Embossed Card Digits / Elements -->
  <rect x="8" y="20" width="3" height="1" fill="#DBEAFE"/>
  <rect x="12" y="20" width="3" height="1" fill="#DBEAFE"/>
  <rect x="16" y="20" width="3" height="1" fill="#DBEAFE"/>
  <rect x="20" y="17" width="5" height="4" fill="#1E1B19"/>
  <rect x="21" y="18" width="3" height="2" fill="#93C5FD"/>
</svg>