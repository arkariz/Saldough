<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Piggy Bank Icon -->
  <!-- Piggy Body Outline -->
  <rect x="7" y="11" width="18" height="13" fill="#1E1B19"/>
  <!-- Ears -->
  <rect x="9" y="8" width="4" height="4" fill="#1E1B19"/>
  <rect x="10" y="9" width="2" height="3" fill="#FB923C"/>
  <!-- Snout -->
  <rect x="4" y="15" width="4" height="6" fill="#1E1B19"/>
  <rect x="5" y="16" width="3" height="4" fill="#FB923C"/>
  <rect x="5" y="17" width="1" height="2" fill="#9A3412"/>
  <!-- Legs -->
  <rect x="8" y="23" width="4" height="5" fill="#1E1B19"/>
  <rect x="9" y="23" width="2" height="4" fill="#C2410C"/>
  <rect x="19" y="23" width="4" height="5" fill="#1E1B19"/>
  <rect x="20" y="23" width="2" height="4" fill="#7C2D12"/>
  <!-- Curly Tail -->
  <rect x="24" y="14" width="4" height="3" fill="#1E1B19"/>
  <rect x="25" y="15" width="2" height="1" fill="#FB923C"/>
  <!-- Main Piggy Body Color & Shading -->
  <rect x="8" y="12" width="16" height="11" fill="#FB923C"/>
  <rect x="9" y="12" width="14" height="2" fill="#FED7AA"/>
  <rect x="8" y="19" width="16" height="4" fill="#C2410C"/>
  <!-- Coin Slot on Back -->
  <rect x="13" y="10" width="6" height="3" fill="#1E1B19"/>
  <rect x="14" y="11" width="4" height="1" fill="#5C1F0A"/>
  <!-- Coin Slipping In (Gold) -->
  <rect x="14" y="6" width="4" height="5" fill="#1E1B19"/>
  <rect x="15" y="7" width="2" height="3" fill="#FACC15"/>
  <rect x="15" y="7" width="2" height="1" fill="#FEF08A"/>
  <!-- Eye -->
  <rect x="9" y="14" width="2" height="2" fill="#1E1B19"/>
  <rect x="9" y="14" width="1" height="1" fill="#FFFFFF"/>
</svg>