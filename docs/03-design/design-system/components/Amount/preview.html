<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Amount</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="gap:16px;max-width:392px">
  <div><div class="tk-t-body-sm tk-ink-2">Total saldo</div><div class="tk-amt tk-t-amount-hero"><span class="tk-amt__cur">Rp</span>27.522.000</div></div>
  <div class="tk-amt tk-t-amount-display" style="text-align:center"><span class="tk-amt__cur">Rp</span>45.000</div>
  <div class="tk-list tk-list--plain">
    <div class="tk-row tk-row--compact"><span class="tk-row__main tk-t-body-sm">Pengeluaran</span><span class="tk-amt tk-t-amount">−Rp45.000</span></div>
    <div class="tk-row tk-row--compact"><span class="tk-row__main tk-t-body-sm">Pemasukan</span><span class="tk-amt tk-t-amount tk-amt--pos">+Rp8.500.000</span></div>
    <div class="tk-row tk-row--compact"><span class="tk-row__main tk-t-body-sm">Transfer</span><span class="tk-amt tk-t-amount tk-amt--muted">Rp300.000</span></div>
    <div class="tk-row tk-row--compact"><span class="tk-row__main tk-t-body-sm">Disembunyikan</span><span class="tk-amt tk-t-amount tk-amt--hidden">Rp•••••</span></div>
  </div>
</div>
</body>
</html>
