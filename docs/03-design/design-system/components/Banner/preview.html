<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Banner</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:392px">
  <div class="tk-banner" role="status"><span class="tk-icon">inbox</span><span class="tk-banner__text">3 transaksi dari notifikasi menunggu dicek.</span><button class="tk-btn tk-btn--sm tk-btn--on-soft">Cek</button></div>
  <div class="tk-banner tk-banner--info"><span class="tk-icon">info</span><span class="tk-banner__text">Pencarian hanya mencakup September.</span><button class="tk-btn tk-btn--sm tk-btn--on-soft">Cari lagi</button></div>
  <div class="tk-banner tk-banner--danger"><span class="tk-icon">error</span><span class="tk-banner__text">Jajan mingguan lewat Rp36.000.</span></div>
  <div class="tk-banner tk-banner--positive"><span class="tk-icon">check_circle</span><span class="tk-banner__text">Pembayaran dicatat diterima. Saldo BCA bertambah Rp2.700.000.</span></div>
</div>
</body>
</html>
