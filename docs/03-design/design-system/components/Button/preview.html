<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="tk tk-demo" style="flex-direction:column;align-items:flex-start;gap:16px">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="tk-btn tk-btn--primary">Simpan pengeluaran</button>
    <button class="tk-btn tk-btn--secondary"><span class="tk-icon">add</span>Tambah dompet</button>
    <button class="tk-btn tk-btn--text">Lihat semua</button>
    <button class="tk-btn tk-btn--danger">Hapus dompet</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="tk-btn tk-btn--primary tk-btn--sm">Catat</button>
    <button class="tk-btn tk-btn--secondary tk-btn--sm">Abaikan</button>
    <button class="tk-btn tk-btn--primary" disabled>Simpan pengeluaran</button>
    <button class="tk-iconbtn" aria-label="Cari"><span class="tk-icon">search</span></button>
    <button class="tk-iconbtn tk-iconbtn--tonal" aria-label="Catat pakai suara"><span class="tk-icon">mic</span></button>
  </div>
  <button class="tk-btn tk-btn--primary tk-btn--block" style="max-width:328px">Simpan pengeluaran</button>
</div>
</body>
</html>
