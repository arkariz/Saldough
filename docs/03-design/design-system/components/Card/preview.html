<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Card</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:392px">
  <section class="tk-section">
    <div class="tk-section__head"><h2 class="tk-section__title">September</h2><a class="tk-link" href="#">Riwayat<span class="tk-icon tk-icon--sm">chevron_right</span></a></div>
    <div class="tk-card" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:8px"><span class="tk-t-body-sm tk-ink-2" style="flex:1">Pemasukan</span><span class="tk-amt tk-t-amount tk-amt--pos">+Rp11.750.000</span></div>
      <div style="display:flex;align-items:center;gap:8px"><span class="tk-t-body-sm tk-ink-2" style="flex:1">Pengeluaran</span><span class="tk-amt tk-t-amount">−Rp2.778.000</span></div>
      <hr class="tk-divider">
      <div style="display:flex;align-items:center;gap:8px"><span class="tk-t-body-strong" style="flex:1">Selisih</span><span class="tk-amt tk-t-amount">+Rp8.972.000</span></div>
    </div>
  </section>
</div>
</body>
</html>
