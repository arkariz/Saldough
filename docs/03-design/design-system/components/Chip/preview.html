<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Chip</title></head>
<body>
<div class="tk tk-demo" style="flex-direction:column;align-items:flex-start">
  <div class="tk-chips" style="flex-wrap:wrap">
    <button class="tk-chip is-selected" aria-pressed="true"><span class="tk-icon">check</span>Makan &amp; Minum</button>
    <button class="tk-chip" aria-pressed="false"><span class="tk-icon">two_wheeler</span>Transportasi</button>
    <button class="tk-chip" aria-pressed="false"><span class="tk-icon">shopping_cart</span>Belanja Harian</button>
    <button class="tk-chip" aria-pressed="false"><span class="tk-icon">more_horiz</span>Semua kategori</button>
  </div>
  <div class="tk-chips" style="flex-wrap:wrap">
    <button class="tk-chip is-selected" aria-pressed="true">Semua 28</button>
    <button class="tk-chip" aria-pressed="false">Pengeluaran 24</button>
    <button class="tk-chip" aria-pressed="false">Pemasukan 2</button>
    <button class="tk-chip" aria-pressed="false">Transfer 2</button>
  </div>
</div>
</body>
</html>
