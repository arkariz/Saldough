<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="tk" style="position:relative;height:280px;max-width:392px;display:grid;place-items:center;overflow:hidden">
  <div class="tk-scrim"></div>
  <div class="tk-dialog" role="alertdialog" aria-labelledby="dt" aria-describedby="db" style="position:relative">
    <h2 class="tk-dialog__title" id="dt">Hapus dompet BCA?</h2>
    <p class="tk-dialog__body" id="db">Dompet dihapus permanen dan tidak bisa dikembalikan. Dompet yang sudah punya transaksi cukup dinonaktifkan.</p>
    <div class="tk-dialog__actions"><button class="tk-btn tk-btn--text">Batal</button><button class="tk-btn tk-btn--danger">Hapus dompet</button></div>
  </div>
</div>
</body>
</html>
