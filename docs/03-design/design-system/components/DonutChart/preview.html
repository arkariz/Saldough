<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>DonutChart</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px">
  <div class="tk-card" style="display:flex;flex-direction:column;gap:8px">
    <div class="tk-donut">
      <svg viewBox="0 0 216 216" role="img" aria-label="Pengeluaran September: Belanja 27%, Cicilan 26%, Tempat tinggal 17%, Makan 11%, Sedekah 7%, Lainnya 12%, Tanpa kategori 1%">
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="159.6 603.2" stroke-dashoffset="0" style="stroke: var(--cat-green)"></circle>
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="151.4 603.2" stroke-dashoffset="-162.1" style="stroke: var(--cat-indigo)"></circle>
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="97.8 603.2" stroke-dashoffset="-316" style="stroke: var(--cat-teal)"></circle>
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="63.3 603.2" stroke-dashoffset="-416.3" style="stroke: var(--cat-orange)"></circle>
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="39.8 603.2" stroke-dashoffset="-482.1" style="stroke: var(--cat-brown)"></circle>
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="70 603.2" stroke-dashoffset="-524.3" style="stroke: var(--cat-slate)"></circle>
        <circle class="tk-donut__seg" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="3.8 603.2" stroke-dashoffset="-596.8" style="stroke: var(--line-strong)"></circle>
      </svg>
      <div class="tk-donut__center"><span class="tk-donut__label">Pengeluaran</span><span class="tk-amt tk-donut__total">Rp11.420.700</span></div>
    </div>
    <p class="tk-cmp" style="justify-content:center"><span class="tk-icon" aria-hidden="true">arrow_upward</span><span><b>Rp583.700</b> dibanding rata-rata 3 bulan</span></p>
  </div>
</div>
</body>
</html>
