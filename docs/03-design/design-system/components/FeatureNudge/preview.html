<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>FeatureNudge</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px">
  <div class="tk-list">
    <div class="tk-row tk-row--compact tk-row--wrap"><span class="tk-tile tk-tile--brandsoft"><span class="tk-icon">notifications</span></span><span class="tk-row__main"><span class="tk-row__title">Catat dari notifikasi</span><span class="tk-row__sub">Izin belum diberikan</span></span><button class="tk-btn tk-btn--secondary tk-btn--sm">Izinkan</button></div>
    <div class="tk-row tk-row--compact tk-row--wrap"><span class="tk-tile tk-tile--brandsoft"><span class="tk-icon">alarm</span></span><span class="tk-row__main"><span class="tk-row__title">Pengingat rutin</span></span><button class="tk-btn tk-btn--secondary tk-btn--sm">Nyalakan</button></div>
  </div>
  <div class="tk-card" style="padding:12px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0"><span class="tk-t-body-sm tk-ink-2">Ingatkan</span><label class="tk-switch"><input type="checkbox" checked aria-label="Ingatkan"><span class="tk-switch__track"></span></label></div>
    <div class="tk-rownote" style="padding:0"><span class="tk-rownote__text">Pengingat belum menyala untuk semua rutin.</span><button class="tk-btn tk-btn--secondary tk-btn--sm">Nyalakan</button></div>
  </div>
</div>
</body>
</html>
