<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Keypad</title></head>
<body>
<div class="tk tk-demo tk-demo--col tk-demo--surface" style="max-width:360px">
  <div class="tk-amt tk-t-amount-display" style="text-align:center" id="amt"><span class="tk-amt__cur">Rp</span><span id="val">45.000</span></div>
  <div class="tk-keypad"><button class="tk-key" data-k="1">1</button><button class="tk-key" data-k="2">2</button><button class="tk-key" data-k="3">3</button><button class="tk-key" data-k="4">4</button><button class="tk-key" data-k="5">5</button><button class="tk-key" data-k="6">6</button><button class="tk-key" data-k="7">7</button><button class="tk-key" data-k="8">8</button><button class="tk-key" data-k="9">9</button><button class="tk-key" data-k="000">000</button><button class="tk-key" data-k="0">0</button><button class="tk-key tk-key--fn" data-k="del" aria-label="Hapus satu digit"><span class="tk-icon">backspace</span></button></div>
</div>
<script>
var digits = '45000';
function fmt(d) { if (!d) return '0'; return String(parseInt(d, 10)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
document.querySelector('.tk-keypad').addEventListener('click', function (e) {
  var b = e.target.closest('.tk-key'); if (!b) return;
  var k = b.getAttribute('data-k');
  if (k === 'del') digits = digits.slice(0, -1); else if ((digits + k).replace(/^0+/, '').length <= 12) digits = (digits + k).replace(/^0+/, '');
  document.getElementById('val').textContent = fmt(digits);
});
</script>
</body>
</html>
