<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>LegendRow</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px">
  <div class="tk-card" style="padding:0">
    <button class="tk-legrow" type="button" aria-pressed="false"><i class="tk-swatch" style="background:var(--cat-green)"></i><span class="tk-legrow__name">Belanja</span><span class="tk-legrow__pct">27%</span><span class="tk-amt tk-legrow__amt">Rp3.068.500</span></button>
    <button class="tk-legrow is-selected" type="button" aria-pressed="true"><i class="tk-swatch" style="background:var(--cat-orange)"></i><span class="tk-legrow__name">Makan</span><span class="tk-legrow__pct">11%</span><span class="tk-amt tk-legrow__amt">Rp1.245.000</span></button>
    <button class="tk-legrow" type="button" aria-pressed="false" aria-expanded="true"><i class="tk-swatch" style="background:var(--cat-slate)"></i><span class="tk-legrow__name">Lainnya (3 kategori) <span class="tk-icon tk-icon--sm tk-ink-2" style="vertical-align:-4px">expand_less</span></span><span class="tk-legrow__pct">12%</span><span class="tk-amt tk-legrow__amt">Rp1.373.200</span></button>
    <button class="tk-legrow tk-legrow--child" type="button" aria-pressed="false"><span class="tk-legrow__name">Tagihan</span><span class="tk-legrow__pct">5%</span><span class="tk-amt tk-legrow__amt">Rp550.000</span></button>
    <button class="tk-legrow tk-legrow--child" type="button" aria-pressed="false"><span class="tk-legrow__name">Langganan</span><span class="tk-legrow__pct">4%</span><span class="tk-amt tk-legrow__amt">Rp413.200</span></button>
    <button class="tk-legrow" type="button" aria-pressed="false"><i class="tk-swatch" style="background:var(--line-strong)"></i><span class="tk-legrow__name">Tanpa kategori</span><span class="tk-legrow__pct">1%</span><span class="tk-amt tk-legrow__amt">Rp120.000</span></button>
  </div>
  <div class="tk-card" style="padding:0 16px;margin-top:12px"><div class="tk-card__foot" style="margin-top:0">
    <div class="tk-xfer"><span class="tk-tile tk-tile--px"><img src="/_blob/383f5d384b57a40bd54de088f7708a49" alt="" width="32" height="32"></span><span class="tk-xfer__main"><span class="tk-xfer__line"><span class="tk-xfer__title">Dipindahkan antardompet</span><span class="tk-amt tk-xfer__amt">Rp1.000.000</span></span><span class="tk-xfer__sub">Tidak mengurangi total uangmu</span></span></div>
  </div></div>
</div>
</body>
</html>
