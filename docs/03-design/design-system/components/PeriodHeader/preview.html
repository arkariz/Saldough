<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>PeriodHeader</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px;gap:12px">
  <div class="tk-period">
    <button class="tk-period__btn" type="button" aria-label="Oktober. Ubah awal bulan keuangan">Oktober<span class="tk-icon">expand_more</span></button>
  </div>
  <div class="tk-period">
    <button class="tk-period__btn" type="button" aria-label="25 Sep sampai 24 Okt. Ubah awal bulan keuangan">25 Sep – 24 Okt<span class="tk-icon">expand_more</span></button>
  </div>
  <div class="tk-period">
    <button class="tk-period__btn" type="button" aria-label="1 sampai 24 Okt, periode peralihan 24 hari. Ubah awal bulan keuangan">1 – 24 Okt<span class="tk-icon">expand_more</span></button>
    <span class="tk-period__tag"><span class="tk-icon">calendar_today</span>Periode peralihan · 24 hari</span>
  </div>
  <div class="tk-period" lang="en">
    <button class="tk-period__btn" type="button" aria-label="25 Sep to 31 Oct, transition period 37 days. Change financial month start">25 Sep – 31 Oct<span class="tk-icon">expand_more</span></button>
    <span class="tk-period__tag"><span class="tk-icon">calendar_today</span>Transition period · 37 days</span>
  </div>
  <div class="tk-card" style="display:flex;flex-direction:column;gap:4px">
    <span class="tk-t-body-sm tk-ink-2">Uang nganggur · 1 – 24 Okt</span>
    <p class="tk-amt tk-t-amount-hero">−Rp8.204.500</p>
    <p class="tk-t-body-sm tk-ink-2">Rentang ini tidak memuat gajian.</p>
  </div>
</div>
</body>
</html>
