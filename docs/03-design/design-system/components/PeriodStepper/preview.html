<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>PeriodStepper</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px;gap:12px">
  <div class="tk-stepper">
    <button class="tk-iconbtn" type="button" aria-label="Periode sebelumnya"><span class="tk-icon">chevron_left</span></button>
    <div class="tk-stepper__label"><span class="tk-stepper__title">September 2026</span></div>
    <button class="tk-iconbtn" type="button" aria-label="Periode berikutnya"><span class="tk-icon">chevron_right</span></button>
  </div>
  <div class="tk-stepper">
    <button class="tk-iconbtn" type="button" aria-label="Periode sebelumnya"><span class="tk-icon">chevron_left</span></button>
    <div class="tk-stepper__label"><span class="tk-stepper__title">1 – 24 Okt</span><span class="tk-period__tag"><span class="tk-icon">calendar_today</span>Periode peralihan · 24 hari</span></div>
    <button class="tk-iconbtn" type="button" aria-label="Periode berikutnya" disabled><span class="tk-icon">chevron_right</span></button>
  </div>
</div>
</body>
</html>
