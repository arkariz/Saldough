<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>PlanCard</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px;gap:12px">
  <div class="tk-plans" role="radiogroup">
    <button class="tk-plan is-selected" type="button" role="radio" aria-checked="true"><span class="tk-plan__radio"></span><span class="tk-plan__main"><span class="tk-plan__title">Tahunan</span><span class="tk-plan__sub">setara Rp14.900/bulan</span></span><span class="tk-plan__price"><span>Rp179.000</span><span class="tk-plan__unit">/tahun</span></span></button>
    <button class="tk-plan" type="button" role="radio" aria-checked="false"><span class="tk-plan__radio"></span><span class="tk-plan__main"><span class="tk-plan__title">Bulanan</span><span class="tk-plan__sub">Bisa dibatalkan kapan saja</span></span><span class="tk-plan__price"><span>Rp25.000</span><span class="tk-plan__unit">/bulan</span></span></button>
  </div>
</div>
</body>
</html>
