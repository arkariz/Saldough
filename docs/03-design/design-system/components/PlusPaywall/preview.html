<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>PlusPaywall</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px;gap:12px">
  <ul class="tk-pillars">
    <li class="tk-pillar is-lead"><span class="tk-icon">photo_camera</span><span>Mencatat</span></li>
    <li class="tk-pillar"><span class="tk-icon">notifications_active</span><span>Berjaga</span></li>
    <li class="tk-pillar"><span class="tk-icon">chat_bubble</span><span>Menjawab</span></li>
    <li class="tk-pillar"><span class="tk-icon">trending_up</span><span>Merencanakan</span></li>
  </ul>
  <div class="tk-plans" role="radiogroup">
    <button class="tk-plan is-selected" type="button" role="radio" aria-checked="true"><span class="tk-plan__radio"></span><span class="tk-plan__main"><span class="tk-plan__title">Tahunan<span class="tk-badge tk-badge--plus">Harga Pendiri</span></span><span class="tk-plan__sub">Terkunci selagi berlangganan · sampai 21 Jan 2027</span></span><span class="tk-plan__price"><span class="tk-plan__was">Rp179.000</span><span>Rp129.000</span><span class="tk-plan__unit">/tahun</span></span></button>
    <button class="tk-plan" type="button" role="radio" aria-checked="false"><span class="tk-plan__radio"></span><span class="tk-plan__main"><span class="tk-plan__title">Bulanan</span><span class="tk-plan__sub">Bisa dibatalkan kapan saja</span></span><span class="tk-plan__price"><span>Rp25.000</span><span class="tk-plan__unit">/bulan</span></span></button>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <button class="tk-btn tk-btn--primary tk-btn--block" type="button">Berlangganan Tahunan</button>
    <button class="tk-btn tk-btn--secondary tk-btn--block" type="button">Nanti saja</button>
    <p class="tk-pw__fine">Rp129.000 per tahun, diperpanjang otomatis. Batalkan kapan saja di Play Store.</p>
  </div>
  <div class="tk-banner tk-banner--danger" role="status"><span class="tk-icon">error</span><span class="tk-banner__text">Pembayaran belum berhasil. Cek metode bayarmu di Play Store, lalu coba lagi.</span></div>
</div>
</body>
</html>
