<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px">
  <div class="tk-seg" role="radiogroup" aria-label="Jenis transaksi">
    <button class="tk-seg__opt is-selected" role="radio" aria-checked="true">Pengeluaran</button>
    <button class="tk-seg__opt" role="radio" aria-checked="false">Pemasukan</button>
    <button class="tk-seg__opt" role="radio" aria-checked="false">Transfer</button>
  </div>
  <div class="tk-seg" role="radiogroup" aria-label="Kotak masuk notifikasi">
    <button class="tk-seg__opt is-selected" role="radio" aria-checked="true">Perlu dicek <span class="tk-seg__count">3</span></button>
    <button class="tk-seg__opt" role="radio" aria-checked="false">Tercatat otomatis <span class="tk-seg__count">5</span></button>
  </div>
</div>
<script>
document.querySelectorAll('.tk-seg').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('.tk-seg__opt'); if (!b) return;
    g.querySelectorAll('.tk-seg__opt').forEach(function (o) { o.classList.toggle('is-selected', o === b); o.setAttribute('aria-checked', o === b ? 'true' : 'false'); });
  });
});
</script>
</body>
</html>
