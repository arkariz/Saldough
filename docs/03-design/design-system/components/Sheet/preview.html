<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Sheet</title></head>
<body>
<div class="tk" style="position:relative;height:370px;max-width:360px;overflow:hidden;background:var(--bg)">
  <div class="tk-scrim"></div>
  <div class="tk-sheet" style="position:absolute;left:0;right:0;bottom:0" role="dialog" aria-labelledby="st">
    <div class="tk-sheet__handle"></div>
    <div class="tk-sheet__head"><button class="tk-iconbtn" aria-label="Tutup"><span class="tk-icon">close</span></button><h2 class="tk-sheet__title" id="st">Pilih dompet</h2><span style="width:48px"></span></div>
    <div class="tk-list" style="margin:0 -16px;border-radius:0">
      <button class="tk-row tk-row--compact"><span class="tk-tile tk-tile--blue"><span class="tk-icon">account_balance</span></span><span class="tk-row__main"><span class="tk-row__title">BCA</span><span class="tk-row__sub tk-amt">Rp14.810.000</span></span></button>
      <button class="tk-row tk-row--compact"><span class="tk-tile tk-tile--teal"><span class="tk-icon">account_balance_wallet</span></span><span class="tk-row__main"><span class="tk-row__title">GoPay</span><span class="tk-row__sub tk-amt">Rp336.000</span></span></button>
      <button class="tk-row tk-row--compact" aria-pressed="true"><span class="tk-tile tk-tile--green"><span class="tk-icon">payments</span></span><span class="tk-row__main"><span class="tk-row__title">Tunai</span><span class="tk-row__sub tk-amt">Rp376.000</span></span><span class="tk-icon" style="color:var(--brand)">check</span></button>
      <button class="tk-row tk-row--compact"><span class="tk-tile tk-tile--amber"><span class="tk-icon">savings</span></span><span class="tk-row__main"><span class="tk-row__title">Tabungan</span><span class="tk-row__sub tk-amt">Rp12.000.000</span></span></button>
    </div>
  </div>
</div>
</body>
</html>
