<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div class="tk tk-demo tk-demo--col tk-demo--surface" style="max-width:360px;gap:16px">
  <div class="tk-field"><label class="tk-field__label" for="f1">Nama dompet</label><div class="tk-field__control"><input id="f1" value="Tabungan Mandiri"></div><div class="tk-field__help">Maksimal 24 karakter.</div></div>
  <div class="tk-field is-error"><label class="tk-field__label" for="f2">Saldo awal</label><div class="tk-field__control"><span class="tk-ink-2">Rp</span><input id="f2" placeholder="0" inputmode="numeric"></div><div class="tk-field__help"><span class="tk-icon tk-icon--sm">error</span>Isi saldo yang ada di dompet ini sekarang.</div></div>
  <label class="tk-search"><span class="tk-icon">search</span><input placeholder="Cari catatan atau kategori" aria-label="Cari transaksi"></label>
</div>
</body>
</html>
