<!-- @dsCard group="Umpan balik" height=620 -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>UpdateCard</title></head>
<body>
<div class="tk tk-demo tk-demo--col" style="max-width:360px">
  <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-upd__emoji">🚀</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>Versi baru tersedia</span><span class="tk-upd__pill">0.6.0</span></div></div><button class="tk-upd__close" aria-label="Nanti"><span class="tk-icon">close</span></button></div><div class="tk-upd__foot"><a class="tk-upd__link"><span class="tk-upd__lt">Lihat apa yang baru</span><span class="tk-icon tk-icon--sm">chevron_right</span></a><button class="tk-btn tk-btn--on-soft tk-btn--sm">Perbarui</button></div></div>
  <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-icon tk-icon--spin">progress_activity</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>Mengunduh versi baru</span></div><span class="tk-upd__desc">Kamu tetap bisa mencatat.</span></div></div></div>
  <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-icon">system_update</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>Versi baru sudah diunduh</span><span class="tk-upd__pill">0.6.0</span></div></div></div><div class="tk-upd__foot"><a class="tk-upd__link"><span class="tk-upd__lt">Lihat apa yang baru</span><span class="tk-icon tk-icon--sm">chevron_right</span></a><button class="tk-btn tk-btn--on-soft tk-btn--sm">Pasang sekarang</button></div></div>
  <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-icon">restart_alt</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>Pembaruan kecil siap</span></div><span class="tk-upd__desc">Tutup lalu buka lagi aplikasi untuk memakainya.</span></div></div><div class="tk-upd__foot tk-upd__foot--end"><button class="tk-btn tk-btn--on-soft tk-btn--sm">Oke</button></div></div>
</div>
</body>
</html>
