<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Akun</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub">
    <a class="tk-iconbtn" href="Main.dc.html" aria-label="Kembali"><span class="tk-icon">arrow_back</span></a>
    <h1 class="tk-topbar__title">Akun</h1>
  </header>

  <main class="tk-body tk-scroll" style="gap: 24px; padding: 0 16px 32px">
    <div class="tk-card" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 16px">
        <img src="/_blob/f544a8e4c6b6329a9497cbf4860ef099" alt="" width="72" height="57" style="image-rendering: pixelated; flex: none">
        <div class="tk-stat">
          <span class="tk-t-body-strong">Belum masuk</span>
          <span class="tk-t-body-sm tk-ink-2">Pencatatan tetap berjalan penuh tanpa akun. Akun menyiapkan cadangan nanti.</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <button class="tk-btn tk-btn--secondary tk-btn--block" type="button">Masuk dengan Google</button>
        <button class="tk-btn tk-btn--text tk-btn--block" type="button">Masuk dengan email</button>
      </div>
    </div>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">Pencatatan</h2></div>
      <div class="tk-list tk-list--icon">
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">label</span><span class="tk-row__main"><span class="tk-row__title">Kategori</span><span class="tk-row__sub">17 kategori</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">notifications</span><span class="tk-row__main"><span class="tk-row__title">Catat dari notifikasi</span><span class="tk-row__sub">Aktif · 2 aplikasi</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        <a class="tk-row tk-row--compact" href="KotakMasuk.dc.html"><span class="tk-icon tk-ink-2">inbox</span><span class="tk-row__main"><span class="tk-row__title">Kotak masuk notifikasi</span><span class="tk-row__sub">Cek tangkapan, batalkan yang otomatis</span></span><span class="tk-badge tk-badge--warning">3</span><span class="tk-icon tk-row__chev">chevron_right</span></a>
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">edit_note</span><span class="tk-row__main"><span class="tk-row__title">Template anggaran</span><span class="tk-row__sub">2 tersimpan</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
      </div>
    </section>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">Tampilan</h2></div>
      <div class="tk-list tk-list--icon">
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">translate</span><span class="tk-row__main"><span class="tk-row__title">Bahasa</span></span><span class="tk-t-body-sm tk-ink-2">Indonesia</span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">payments</span><span class="tk-row__main"><span class="tk-row__title">Mata uang</span></span><span class="tk-t-body-sm tk-ink-2">Rupiah (IDR)</span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">dark_mode</span><span class="tk-row__main"><span class="tk-row__title">Tema</span></span><span class="tk-t-body-sm tk-ink-2">Ikuti sistem</span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        <label class="tk-row tk-row--compact"><span class="tk-icon tk-ink-2">visibility_off</span><span class="tk-row__main"><span class="tk-row__title">Sembunyikan nominal</span><span class="tk-row__sub">Saat aplikasi dibuka</span></span><span class="tk-switch"><input type="checkbox" aria-label="Sembunyikan nominal saat aplikasi dibuka"><span class="tk-switch__track"></span></span></label>
      </div>
    </section>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">Data dan privasi</h2></div>
      <div class="tk-list tk-list--icon">
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">lock</span><span class="tk-row__main"><span class="tk-row__title">Data kamu</span><span class="tk-row__sub">Tersimpan di perangkat ini</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">info</span><span class="tk-row__main"><span class="tk-row__title">Kebijakan privasi</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
      </div>
    </section>

    <p class="tk-t-caption tk-ink-3" style="text-align: center">Tanukonomy 0.4.0 (5)</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
