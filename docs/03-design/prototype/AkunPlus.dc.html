<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Akun, status Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,cloud_done,credit_card,dark_mode,delete,description,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,open_in_new,payments,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,settings_backup_restore,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,table_view,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><a class="tk-iconbtn" href="Main.dc.html" aria-label="{{t.back}}"><span class="tk-icon">arrow_back</span></a><h1 class="tk-topbar__title">{{t.account}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 24px; padding: 0 16px 32px">
    <div class="tk-card" style="display: flex; align-items: center; gap: 16px"><img src="/_blob/f544a8e4c6b6329a9497cbf4860ef099" alt="" width="56" height="45" style="image-rendering: pixelated; flex: none"><div class="tk-stat"><span class="tk-t-body-strong">{{t.noAccount}}</span><span class="tk-t-body-sm tk-ink-2">{{t.noAccountSub}}</span></div></div>
    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">{{t.plus}}</h2></div>
      <div class="tk-list tk-list--icon">
        <a class="tk-row tk-row--compact tk-row--wrap" href="{{pl.href}}"><span class="tk-icon tk-ink-2" aria-hidden="true">workspace_premium</span><span class="tk-row__main"><span class="tk-row__title">Tanukonomy Plus</span><span class="tk-row__sub" style="white-space: normal">{{pl.sub}}</span></span><sc-if value="{{pl.hasBadge}}" hint-placeholder-val="{{false}}"><span class="{{pl.badgeCls}}">{{pl.badge}}</span></sc-if><span class="tk-icon tk-row__chev">chevron_right</span></a>
        <sc-if value="{{pl.hasManage}}" hint-placeholder-val="{{false}}"><button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2" aria-hidden="true">open_in_new</span><span class="tk-row__main"><span class="tk-row__title">{{pl.manage}}</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button></sc-if>
        <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2" aria-hidden="true">restore</span><span class="tk-row__main"><span class="tk-row__title">{{pl.restore}}</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
      </div>
    </section>
    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">{{t.recording}}</h2></div>
      <div class="tk-list tk-list--icon"><button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2" aria-hidden="true">label</span><span class="tk-row__main"><span class="tk-row__title">{{t.categories}}</span><span class="tk-row__sub">17</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button></div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plus":{"editor":"enum","options":["gratis","uji","aktif","berakhir","tenggang","penguji"],"default":"gratis","section":"Status Plus"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const PLT = en ? { sub: { gratis: 'Free. See what Tanuki can do for you.', uji: 'Until 24 Nov. No card needed.', aktif: 'Yearly, renews on 22 Oct 2027', berakhir: 'Yearly, active until 22 Oct 2027, not renewing', tenggang: 'Payment did not go through. Plus stays on until 25 Oct.', penguji: 'From the tester program until 22 Oct 2027' }, badge: { uji: 'Trial', aktif: 'Plus', berakhir: 'Plus', tenggang: 'Check', penguji: 'Plus' }, manage: 'Manage in the Play Store', restore: 'Restore purchases' }
      : { sub: { gratis: 'Gratis. Lihat apa yang bisa dikerjakan Tanuki.', uji: 'Sampai 24 Nov. Tanpa kartu.', aktif: 'Tahunan, diperpanjang 22 Okt 2027', berakhir: 'Tahunan, aktif sampai 22 Okt 2027, tidak diperpanjang', tenggang: 'Pembayaran belum berhasil. Plus tetap aktif sampai 25 Okt.', penguji: 'Dari program penguji sampai 22 Okt 2027' }, badge: { uji: 'Uji coba', aktif: 'Plus', berakhir: 'Plus', tenggang: 'Cek', penguji: 'Plus' }, manage: 'Kelola di Play Store', restore: 'Pulihkan pembelian' };
    const plk = this.props.plus || 'gratis';
    const pl = { sub: PLT.sub[plk], hasBadge: plk !== 'gratis', badge: PLT.badge[plk] || '', badgeCls: plk === 'tenggang' ? 'tk-badge tk-badge--warning' : 'tk-badge tk-badge--brand', href: (plk === 'gratis' || plk === 'uji' || plk === 'berakhir') ? 'Paywall.dc.html' : plk === 'tenggang' ? 'Akun.dc.html' : 'FiturPlus.dc.html', hasManage: plk !== 'gratis' && plk !== 'uji' && plk !== 'penguji', manage: PLT.manage, restore: PLT.restore };
    const t = en ? { back: 'Back', account: 'Account', noAccount: 'Not signed in', noAccountSub: 'Recording works fully without an account.', plus: 'Plus', recording: 'Recording', categories: 'Categories' }
      : { back: 'Kembali', account: 'Akun', noAccount: 'Belum masuk', noAccountSub: 'Pencatatan tetap berjalan penuh tanpa akun.', plus: 'Plus', recording: 'Pencatatan', categories: 'Kategori' };
    return { theme: this.props.dark ? 'dark' : 'light', t: t, pl: pl };
  }
}
</script>
</body>
</html>
