<body>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><h1 class="tk-topbar__title" style="padding-left: 12px">{{title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 32px">
    <p class="tk-t-body-sm tk-ink-2">{{intro}}</p>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <p class="tk-t-label-sm tk-ink-2">{{g.cap}}</p>
        <div class="tk-list tk-list--icon">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div class="tk-row tk-row--compact tk-row--wrap"><span class="tk-icon tk-ink-2">{{r.icon}}</span><span class="tk-row__main"><span class="tk-row__title">{{r.title}}</span><span class="tk-row__sub" style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px"><sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{true}}"><span class="{{r.cls}}">{{r.badge}}</span></sc-if><sc-if value="{{r.hasDetail}}" hint-placeholder-val="{{false}}"><span>{{r.detail}}</span></sc-if></span></span><span class="tk-icon tk-row__chev">chevron_right</span></div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>

};const BCLS = {"on": "tk-badge tk-badge--positive", "off": "tk-badge", "perm": "tk-badge tk-badge--warning"};
const akunRows = (t, n, r, d) => {
  const m = { nyala: 'on', mati: 'off', izin: 'perm' };
  return [
    { icon: 'notifications', title: t.rowNotif, hasBadge: true, badge: t.st[m[n]], cls: BCLS[m[n]], hasDetail: n === 'nyala', detail: t.apps },
    { icon: 'alarm', title: t.rowRem, hasBadge: true, badge: t.st[m[r]], cls: BCLS[m[r]], hasDetail: false, detail: '' },
    { icon: 'calendar_today', title: t.rowPer, hasBadge: false, badge: '', cls: '', hasDetail: true, detail: d }
  ];
};
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = S[en ? 'en' : 'id'];
    const d = t.perValue.replace('{d}', '25');
    return {
      theme: this.props.dark ? 'dark' : 'light', title: t.title.akun, intro: t.intro.akun,
      groups: [
        { cap: t.st.on + ' / ' + t.st.off, rows: akunRows(t, 'nyala', 'mati', d) },
        { cap: t.st.off + ' / ' + t.st.on, rows: akunRows(t, 'mati', 'nyala', d) },
        { cap: t.st.perm + ' / ' + t.st.perm, rows: akunRows(t, 'izin', 'izin', d) }
      ]
    };
  }
}

</body>
