<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub">
    <h1 class="tk-topbar__title" style="padding-left: 12px">{{title}}</h1>
  </header>
  <main class="tk-body tk-scroll" style="gap: 24px; padding: 0 16px 32px">
    <p class="tk-t-body-sm tk-ink-2">{{intro}}</p>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <p class="tk-t-label-sm tk-ink-2">{{b1.cap}}</p>
      <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-upd__emoji">🚀</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>{{b1.title}}</span><span class="tk-upd__pill">{{ver}}</span></div></div><button class="tk-upd__close" type="button" aria-label="{{later}}"><span class="tk-icon">close</span></button></div><div class="tk-upd__foot"><a class="tk-upd__link" href="ApaYangBaruPra.dc.html"><span class="tk-upd__lt">{{link}}</span><span class="tk-icon tk-icon--sm">chevron_right</span></a><button class="tk-btn tk-btn--on-soft tk-btn--sm" type="button">{{update}}</button></div></div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <p class="tk-t-label-sm tk-ink-2">{{b2.cap}}</p>
      <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-icon tk-icon--spin">progress_activity</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>{{b2.title}}</span></div><sc-if value="{{b2.hasDesc}}" hint-placeholder-val="{{false}}"><span class="tk-upd__desc">{{b2.desc}}</span></sc-if></div></div></div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <p class="tk-t-label-sm tk-ink-2">{{b3.cap}}</p>
      <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-icon">system_update</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>{{b3.title}}</span><span class="tk-upd__pill">{{ver}}</span></div></div></div><div class="tk-upd__foot"><a class="tk-upd__link" href="ApaYangBaruPra.dc.html"><span class="tk-upd__lt">{{link}}</span><span class="tk-icon tk-icon--sm">chevron_right</span></a><a class="tk-btn tk-btn--on-soft tk-btn--sm" href="ApaYangBaru.dc.html">{{install}}</a></div></div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <p class="tk-t-label-sm tk-ink-2">{{b4.cap}}</p>
      <div class="tk-upd" role="status"><div class="tk-upd__top"><span class="tk-upd__tile" aria-hidden="true"><span class="tk-icon">restart_alt</span></span><div class="tk-upd__body"><div class="tk-upd__title"><span>{{b4.title}}</span></div><sc-if value="{{b4.hasDesc}}" hint-placeholder-val="{{false}}"><span class="tk-upd__desc">{{b4.desc}}</span></sc-if></div></div><div class="tk-upd__foot tk-upd__foot--end"><button class="tk-btn tk-btn--on-soft tk-btn--sm" type="button">{{ok}}</button></div></div>
    </section>
  </main>
</div>

const ver = (r, en) => r.v + ' (' + r.b + ')' + (r.p ? ', ' + T(en).patch + ' ' + r.p : '');
const notesOf = (r, en) => r.notes.map((n) => ({ c: D.cats[n[0]].c, emoji: D.cats[n[0]].emoji, tag: D.cats[n[0]][en ? 'en' : 'id'], text: n[en ? 2 : 1] }));
const rel = (v, b, p) => D.releases.filter((r) => r.v === v && r.b === b && r.p === p)[0];

class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = T(en);
    const mk = (k) => ({ title: t.banner[k][0], desc: t.banner[k][1], hasDesc: !!t.banner[k][1], cap: t.cap[k] });
    return {
      theme: this.props.dark ? 'dark' : 'light',
      title: en ? 'Update banners' : 'Banner pembaruan',
      intro: en ? 'One banner per screen. Shown together here only for comparison.' : 'Satu banner per layar. Di sini ditampilkan bersama hanya untuk perbandingan.',
