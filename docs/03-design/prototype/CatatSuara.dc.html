<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Catat pakai suara</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--surface)">
  <div class="tk-sheet__head" style="margin: 0; padding: 8px 4px 0">
    <a class="tk-iconbtn" href="Main.dc.html" aria-label="Tutup"><span class="tk-icon">close</span></a>
    <h1 class="tk-sheet__title">Catat pakai suara</h1>
    <span style="width: 48px; flex: none"></span>
  </div>

  <sc-if value="{{listening}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p class="tk-t-title">Silakan bicara.</p>
        <p class="tk-t-body-sm tk-ink-2">Berhenti sendiri saat kamu diam.</p>
      </div>
      <div style="width: 100%; box-sizing: border-box; padding: 16px; border-radius: 20px; background: var(--surface-2); text-align: left; display: flex; flex-direction: column; gap: 4px">
        <span class="tk-t-caption tk-ink-2">Tertangkap</span>
        <span class="tk-t-body-strong">makan siang 35 ribu pakai BCA</span>
      </div>
      <button type="button" aria-label="Selesai merekam" onClick="{{stop}}" style="width: 96px; height: 96px; margin: 24px 0 8px; border-radius: 999px; border: 0; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: 0 0 0 12px var(--brand-soft), 0 0 0 24px var(--surface-2); cursor: pointer"><span class="tk-icon tk-icon--fill" style="font-size: 40px">mic</span></button>
      <p class="tk-t-body-sm tk-ink-2">Ketuk untuk selesai. Contoh: “bensin 50 ribu pakai GoPay”.</p>
    </div>
    <div style="display: flex; justify-content: center; padding: 0 16px 24px">
      <a class="tk-btn tk-btn--text" href="Catat.dc.html">Ketik saja</a>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div class="tk-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 16px">
      <div style="padding: 12px 16px; border-radius: 20px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px">
        <span class="tk-t-caption tk-ink-2">Tertangkap</span>
        <span class="tk-t-body">“makan siang 35 ribu pakai BCA”</span>
      </div>
      <section class="tk-section">
        <div class="tk-section__head"><h2 class="tk-section__title">Periksa sebelum mencatat</h2></div>
        <div class="tk-list tk-list--icon" style="margin: 0 -16px; clip-path: none; border-radius: 0; background: transparent">
          <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">payments</span><span class="tk-row__main"><span class="tk-row__label">Nominal</span><span class="tk-amt tk-t-amount">Rp35.000</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
          <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">receipt_long</span><span class="tk-row__main"><span class="tk-row__label">Jenis</span><span class="tk-row__title">Pengeluaran</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
          <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">restaurant</span><span class="tk-row__main"><span class="tk-row__label">Kategori</span><span class="tk-row__title">Makan &amp; Minum</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
          <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">account_balance</span><span class="tk-row__main"><span class="tk-row__label">Dompet</span><span class="tk-row__title">BCA</span></span><span class="tk-t-caption tk-ink-2">Saldo jadi Rp14.775.000</span><span class="tk-icon tk-row__chev">chevron_right</span></button>
          <button class="tk-row tk-row--compact" type="button"><span class="tk-icon tk-ink-2">calendar_today</span><span class="tk-row__main"><span class="tk-row__label">Tanggal</span><span class="tk-row__title">Hari ini, 12.25</span></span><span class="tk-icon tk-row__chev">chevron_right</span></button>
        </div>
      </section>
    </div>
    <div class="tk-sticky-action" style="display: flex; gap: 8px">
      <button class="tk-btn tk-btn--secondary" type="button" onClick="{{again}}" style="flex: none"><span class="tk-icon">mic</span>Rekam ulang</button>
      <a class="tk-btn tk-btn--primary" href="Main.dc.html" style="flex: 1">Simpan pengeluaran</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const done = !!(this.state && this.state.done);
    return {
      theme: this.props.dark ? 'dark' : 'light',
      listening: !done,
      done: done,
      stop: () => this.setState({ done: true }),
      again: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
