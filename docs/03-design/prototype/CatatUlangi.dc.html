<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Catat dengan Ulangi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="rencana.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--surface)">
  <div class="tk-sheet__head" style="margin: 0; padding: 8px 4px 0">
    <a class="tk-iconbtn" href="BerandaRutin.dc.html" aria-label="Tutup"><span class="tk-icon">close</span></a>
    <h1 class="tk-sheet__title">Catat</h1>
    <button class="tk-iconbtn tk-iconbtn--tonal" type="button" aria-label="Catat pakai suara"><span class="tk-icon">mic</span></button>
  </div>

  <div class="tk-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column">
    <div style="padding: 4px 16px 0">
      <div class="tk-seg" role="radiogroup" aria-label="Jenis transaksi">
        <button class="tk-seg__opt is-selected" type="button" role="radio" aria-checked="true">Pengeluaran</button>
        <button class="tk-seg__opt" type="button" role="radio" aria-checked="false">Pemasukan</button>
        <button class="tk-seg__opt" type="button" role="radio" aria-checked="false">Transfer</button>
      </div>
    </div>

    <div style="padding: 12px 16px 8px; text-align: center">
      <p class="tk-amt tk-t-amount-display"><span class="tk-amt__cur">Rp</span>65.000</p>
    </div>

    <div class="tk-list tk-list--icon" style="border-radius: 0; clip-path: none">
      <button class="tk-row tk-row--compact" type="button">
        <span class="tk-tile tk-tile--px" style="width: 32px; height: 32px"><img src="/_blob/cc1e488ee5f43c050d4c6558ebd58a86" alt="" width="24" height="24"></span>
        <span class="tk-row__main"><span class="tk-row__label">Kategori</span><span class="tk-row__title">Hiburan</span></span>
        <span class="tk-icon tk-row__chev">chevron_right</span>
      </button>
      <button class="tk-row tk-row--compact" type="button">
        <span class="tk-icon tk-ink-2">account_balance_wallet</span>
        <span class="tk-row__main"><span class="tk-row__label">Dompet</span><span class="tk-row__title">BCA</span></span>
        <span class="tk-icon tk-row__chev">chevron_right</span>
      </button>
      <button class="tk-row tk-row--compact" type="button">
        <span class="tk-icon tk-ink-2">calendar_today</span>
        <span class="tk-row__main"><span class="tk-row__label">Tanggal</span><span class="tk-row__title">Kam, 1 Okt</span></span>
        <span class="tk-icon tk-row__chev">chevron_right</span>
      </button>
      <button class="tk-row tk-row--compact" type="button">
        <span class="tk-icon tk-ink-2">sticky_note_2</span>
        <span class="tk-row__main"><span class="tk-row__label">Catatan</span><span class="tk-row__title">Netflix</span></span>
        <span class="tk-icon tk-row__chev">chevron_right</span>
      </button>
    </div>

    <div style="padding: 12px 16px 0">
      <div class="repeat">
        <div role="switch" aria-checked="{{on.checked}}" tabindex="0" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 12px; cursor: pointer">
          <span class="tk-icon tk-ink-2">schedule</span>
          <span class="tk-row__main"><span class="tk-row__title">Ulangi</span><span class="tk-row__sub">{{on.sub}}</span></span>
          <sc-if value="{{on.yes}}" hint-placeholder-val="{{false}}"><span class="tk-switch" style="pointer-events: none"><input type="checkbox" checked tabindex="-1" aria-hidden="true"><span class="tk-switch__track"></span></span></sc-if>
          <sc-if value="{{on.no}}" hint-placeholder-val="{{true}}"><span class="tk-switch" style="pointer-events: none"><input type="checkbox" tabindex="-1" aria-hidden="true"><span class="tk-switch__track"></span></span></sc-if>
        </div>
        <sc-if value="{{on.yes}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <div class="tk-chips" role="radiogroup" aria-label="Seberapa sering">
              <button class="tk-chip {{p0.cls}}" type="button" role="radio" aria-checked="{{p0.checked}}" onClick="{{p0.pick}}">Tiap minggu</button>
              <button class="tk-chip {{p1.cls}}" type="button" role="radio" aria-checked="{{p1.checked}}" onClick="{{p1.pick}}">Tiap bulan</button>
              <button class="tk-chip {{p2.cls}}" type="button" role="radio" aria-checked="{{p2.checked}}" onClick="{{p2.pick}}">Tiap tahun</button>
              <button class="tk-chip" type="button">Lainnya</button>
            </div>
            <div class="inset__row"><span class="tk-ink-2">Jatuh tempo</span><span style="font-weight: 600">{{due}}</span></div>
            <div class="tk-seg" role="radiogroup" aria-label="Cara bayar">
              <button class="tk-seg__opt {{m0.cls}}" type="button" role="radio" aria-checked="{{m0.checked}}" onClick="{{m0.pick}}">Autodebet</button>
              <button class="tk-seg__opt {{m1.cls}}" type="button" role="radio" aria-checked="{{m1.checked}}" onClick="{{m1.pick}}">Bayar sendiri</button>
            </div>
            <span class="tk-t-body-sm tk-ink-2">{{modeHint}}</span>
            <button class="tk-link" type="button" style="align-self: flex-start">Atur lebih lanjut<span class="tk-icon tk-icon--sm">chevron_right</span></button>
          </div>
        </sc-if>
      </div>
    </div>
  </div>

  <div style="padding: 12px 16px 16px; flex: none">
    <span class="tk-pixel-shadow"><a class="tk-btn tk-btn--primary tk-btn--block" href="{{saveHref}}" style="--u: 4px">{{saveLabel}}</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const on = !!s.on;
    const period = s.period || 'month';
    const mode = s.mode || 'auto';
    const opt = (key, cur, field) => ({
      cls: cur === key ? 'is-selected' : '',
      checked: cur === key ? 'true' : 'false',
      pick: () => this.setState({ [field]: key })
    });
    const due = { week: 'tiap Kamis', month: 'tiap tanggal 1', year: 'tiap 1 Okt' }[period];
    return {
      theme: this.props.dark ? 'dark' : 'light',
      on: { yes: on, no: !on, checked: on ? 'true' : 'false', sub: on ? 'Mulai 1 Okt, tanpa akhir' : 'Tidak' },
      toggle: () => this.setState({ on: !on }),
      p0: opt('week', period, 'period'), p1: opt('month', period, 'period'), p2: opt('year', period, 'period'),
      m0: opt('auto', mode, 'mode'), m1: opt('manual', mode, 'mode'),
      due: due,
      modeHint: mode === 'auto' ? 'Terjadi sendiri di bank. Diingatkan hanya bila saldo dompet diperkirakan kurang.' : 'Diingatkan sehari sebelum jatuh tempo.',
      saveLabel: on ? 'Catat & jadwalkan' : 'Simpan pengeluaran',
      saveHref: on ? 'Rutin.dc.html' : 'Beranda.dc.html'
    };
  }
}
</script>
</body>
</html>
