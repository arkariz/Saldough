<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dompet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar">
    <h1 class="tk-topbar__title">{{t.title}}</h1>
    <button class="tk-iconbtn" type="button" aria-label="{{t.add}}"><span class="tk-icon">add</span></button>
  </header>

  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 32px">
    <section class="tk-card" style="display: flex; flex-direction: column; gap: 2px">
      <p class="tk-t-body-sm tk-ink-2">{{t.total}}</p>
      <p class="tk-amt tk-t-amount-hero {{hidCls}}">{{totalText}}</p>
      <p class="tk-t-body-sm tk-ink-2">{{activeText}}</p>
    </section>

    <sc-if value="{{multi}}" hint-placeholder-val="{{true}}">
      <section class="tk-card tk-spread {{openCls}}">
        <button class="tk-spread__head" type="button" aria-expanded="{{openAria}}" onClick="{{toggle}}">
          <span class="tk-tile tk-tile--brandsoft"><span class="tk-icon">donut_small</span></span>
          <span class="tk-spread__main"><span class="tk-spread__title">{{t.spread}}</span><span class="tk-spread__sub">{{headSub}}</span></span>
          <span class="tk-icon tk-spread__chev" aria-hidden="true">expand_more</span>
        </button>

        <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
          <div class="tk-spread__bar" role="img" aria-label="{{aria}}">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="width: {{b.w}}%; background: {{b.color}}"></span></sc-for>
          </div>
          <ul class="tk-spread__keys" aria-hidden="true">
            <sc-for list="{{items}}" as="k" hint-placeholder-count="4"><li class="tk-spread__key"><i class="tk-swatch" style="background: {{k.color}}"></i>{{k.name}} {{k.pct}}</li></sc-for>
          </ul>
        </sc-if>

        <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
          <div class="tk-spread__body">
            <div class="tk-donut">
              <svg viewBox="0 0 216 216" role="img" aria-label="{{aria}}">
                <sc-for list="{{slices}}" as="sl" hint-placeholder-count="4">
                  <circle class="tk-donut__seg {{sl.cls}}" cx="108" cy="108" r="96" stroke-width="24" stroke-dasharray="{{sl.dash}}" stroke-dashoffset="{{sl.off}}" style="stroke: {{sl.color}}" onClick="{{sl.pick}}"></circle>
                </sc-for>
              </svg>
              <div class="tk-donut__center" aria-live="polite">
                <span class="tk-donut__label">{{c.label}}</span>
                <span class="tk-amt tk-donut__total {{hidCls}}">{{c.amt}}</span>
                <sc-if value="{{c.hasPct}}" hint-placeholder-val="{{false}}"><span class="tk-donut__label">{{c.pct}}</span></sc-if>
              </div>
            </div>
            <div class="tk-spread__legend">
              <sc-for list="{{items}}" as="r" hint-placeholder-count="4">
                <button class="tk-legchip {{r.cls}}" type="button" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" onClick="{{r.pick}}">
                  <i class="tk-swatch" style="background: {{r.color}}"></i>
                  <span class="tk-legchip__name">{{r.name}}</span>
                  <span class="tk-legchip__pct">{{r.pct}}</span>
                </button>
              </sc-for>
            </div>
            <div class="tk-spread__foot">
              <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
                <button class="tk-btn tk-btn--text tk-btn--sm" type="button" onClick="{{showTotal}}">{{t.seeTotal}}</button>
              </sc-if>
              <button class="tk-btn tk-btn--text tk-btn--sm" type="button" onClick="{{close}}">{{t.hide}}<span class="tk-icon tk-icon--sm">expand_less</span></button>
            </div>
          </div>
        </sc-if>
      </section>
    </sc-if>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">{{t.listTitle}} <span class="tk-badge" style="vertical-align: 2px">{{count}}</span></h2></div>
      <div class="tk-list">
        <sc-for list="{{rows}}" as="w" hint-placeholder-count="4">
          <div class="tk-row {{w.cls}}">
            <span class="tk-tile tk-tile--px"><img src="{{w.icon}}" alt="" width="32" height="32"></span>
            <span class="tk-row__main"><span class="tk-row__title">{{w.name}}</span><span class="tk-row__sub"><sc-if value="{{multi}}" hint-placeholder-val="{{true}}"><i class="tk-swatch" style="background: {{w.color}}"></i></sc-if>{{w.sub}}</span></span>
            <span class="tk-row__end"><span class="tk-amt tk-t-amount {{hidCls}}">{{w.amt}}</span></span>
          </div>
        </sc-for>
      </div>
    </section>

    <div class="tk-list tk-list--plain">
      <button class="tk-row tk-row--compact" type="button">
        <span class="tk-row__main"><span class="tk-row__title">{{t.inactive}}</span><span class="tk-row__sub">{{t.inactiveSub}}</span></span>
        <span class="tk-icon tk-row__chev">chevron_right</span>
      </button>
    </div>

    <button class="tk-btn tk-btn--secondary tk-btn--block" type="button"><span class="tk-icon">add</span>{{t.add}}</button>
  </main>

  <nav class="tk-nav" aria-label="{{t.nav}}">
    <a class="tk-nav__item" href="Main.dc.html"><span class="tk-nav__pill"><span class="tk-icon">home</span></span>{{t.home}}</a>
    <a class="tk-nav__item" href="Riwayat.dc.html"><span class="tk-nav__pill"><span class="tk-icon">receipt_long</span></span>{{t.history}}</a>
    <a class="tk-nav__catat" href="Catat.dc.html" aria-label="{{t.record}}"><span class="tk-pixel-shadow"><span class="tk-nav__catat-btn"><span class="tk-icon">add</span></span></span>{{t.recordShort}}</a>
    <a class="tk-nav__item" href="Anggaran.dc.html"><span class="tk-nav__pill"><span class="tk-icon">donut_small</span></span>{{t.plan}}</a>
    <a class="tk-nav__item is-active" href="Dompet.dc.html" aria-current="page"><span class="tk-nav__pill"><span class="tk-icon">account_balance_wallet</span></span>{{t.title}}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"terbuka":{"editor":"boolean","default":false,"section":"Keadaan"},"pilih":{"editor":"enum","options":["","bca","tabungan","tunai","gopay"],"default":"","section":"Keadaan"},"satuDompet":{"editor":"boolean","default":false,"section":"Keadaan"},"hidden":{"editor":"boolean","default":false,"section":"Keadaan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const en = !!this.props.en, hid = !!this.props.hidden;
    const T = en ? {
      title: 'Wallets', add: 'Add wallet', total: 'Total balance', active: (n) => n + (n === 1 ? ' active wallet' : ' active wallets'),
      spread: 'Balance spread', tapOpen: 'Tap to see the chart', tapClose: 'Tap to close the chart', of: 'of total balance',
      seeTotal: 'See total', hide: 'Hide', listTitle: 'Active wallets', inactive: 'Inactive wallets', inactiveSub: "1 wallet · hidden in Record",
      nav: 'Main navigation', home: 'Home', history: 'History', record: 'Record a transaction', recordShort: 'Record', plan: 'Plan',
      ariaPre: 'Balance spread: ', kind: { bank: 'Bank', save: 'Savings', cash: 'Cash', ewallet: 'E-wallet' }, name: { tabungan: 'Savings', tunai: 'Cash' }
    } : {
      title: 'Dompet', add: 'Tambah dompet', total: 'Total saldo', active: (n) => n + ' dompet aktif',
      spread: 'Sebaran saldo', tapOpen: 'Ketuk untuk melihat diagram', tapClose: 'Ketuk untuk menutup diagram', of: 'dari total saldo',
      seeTotal: 'Lihat total', hide: 'Sembunyikan', listTitle: 'Dompet aktif', inactive: 'Dompet nonaktif', inactiveSub: '1 dompet · tidak muncul di Catat',
      nav: 'Navigasi utama', home: 'Beranda', history: 'Riwayat', record: 'Catat transaksi', recordShort: 'Catat', plan: 'Rencana',
      ariaPre: 'Sebaran saldo: ', kind: { bank: 'Bank', save: 'Tabungan', cash: 'Uang tunai', ewallet: 'Dompet digital' }, name: { tabungan: 'Tabungan', tunai: 'Tunai' }
    };
    const B = (id) => '/_blob/' + id;
    // Saldo contoh sama dengan Beranda (Rp27.522.000). Warna irisan: token cat-* per dompet, tetap di semua layar.
    const ALL = [
      { key: 'bca', name: 'BCA', kind: 'bank', v: 14810000, color: 'var(--cat-blue)', icon: B('217eb2f48cad6b961b3185249370f3c9') },
      { key: 'tabungan', name: T.name.tabungan, kind: 'save', v: 12000000, color: 'var(--cat-amber)', icon: B('691ca2ad7e1ed879117fb2ac4ca15945') },
      { key: 'tunai', name: T.name.tunai, kind: 'cash', v: 376000, color: 'var(--cat-green)', icon: B('ea1420161b242fab71bcc8a63b1fc1a7') },
      { key: 'gopay', name: 'GoPay', kind: 'ewallet', v: 336000, color: 'var(--cat-teal)', icon: B('cba0eebb79b34aefa3656aa67db49493') }
    ];
    const W = this.props.satuDompet ? ALL.slice(0, 1) : ALL;
    const multi = W.length > 1;
    const total = W.reduce((a, w) => a + w.v, 0);
    const dots = (x) => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const rp = (x) => hid ? 'Rp•••••' : 'Rp' + dots(x);
    const pct = (v) => { const p = v / total * 100; return p > 0 && p < 0.5 ? '<1%' : Math.floor(p + 0.5) + '%'; };
    const open = s.open !== undefined ? s.open : !!this.props.terbuka;
    const selKey = s.sel !== undefined ? s.sel : (this.props.pilih || '');
    const sel = open ? (W.find((w) => w.key === selKey) || null) : null;
    const pick = (k) => () => this.setState({ sel: selKey === k ? '' : k, open: true });
    const geo = this.donutGeo(W, total);
    const items = W.map((w) => ({
      key: w.key, name: w.name, color: w.color, pct: pct(w.v),
      cls: sel && sel.key === w.key ? 'is-selected' : '', pressed: sel && sel.key === w.key ? 'true' : 'false',
      aria: w.name + ', ' + pct(w.v) + ', ' + rp(w.v), pick: pick(w.key)
    }));
    return {
      theme: this.props.dark ? 'dark' : 'light', t: T, multi: multi, hidCls: hid ? 'tk-amt--hidden' : '',
      totalText: rp(total), activeText: T.active(W.length), count: String(W.length),
      open: open, closed: !open, openCls: open ? 'is-open' : '', openAria: open ? 'true' : 'false',
      headSub: open ? T.tapClose : T.tapOpen,
      toggle: () => this.setState({ open: !open, sel: '' }),
      close: () => this.setState({ open: false, sel: '' }),
      showTotal: () => this.setState({ sel: '' }),
      hasSel: !!sel,
      aria: T.ariaPre + W.map((w) => w.name + ' ' + pct(w.v)).join(', '),
      bars: W.map((w) => ({ w: Math.round(w.v / total * 1000) / 10, color: w.color })),
      items: items,
      slices: geo.map((g, i) => Object.assign(g, { cls: sel && W[i].key !== sel.key ? 'is-dim' : '', pick: pick(W[i].key) })),
      c: sel ? { label: sel.name, amt: rp(sel.v), hasPct: true, pct: pct(sel.v) + ' ' + T.of }
             : { label: T.total, amt: rp(total), hasPct: true, pct: T.active(W.length) },
      rows: W.map((w) => ({
        name: w.name, icon: w.icon, color: w.color, amt: rp(w.v),
        sub: T.kind[w.kind] + (multi ? ' · ' + pct(w.v) : ''),
        cls: sel && sel.key === w.key ? 'is-linked' : ''
      }))
    };
  }
  // Sama dengan Analisis: lingkar r 96, celah 2,5px antaririsan; irisan kecil tetap terlihat (minimal 6px supaya bisa diketuk).
  donutGeo(items, total) {
    const C = 2 * Math.PI * 96, GAP = items.length > 1 ? 2.5 : 0;
    let at = 0;
    return items.filter((it) => it.v > 0).map((it) => {
      const full = it.v / total * C;
      const len = Math.max(6, full - GAP);
      const sl = { dash: (Math.round(len * 10) / 10) + ' ' + (Math.round(C * 10) / 10), off: String(-(Math.round(at * 10) / 10)), color: it.color };
      at += full;
      return sl;
    });
  }
}
</script>
</body>
</html>
