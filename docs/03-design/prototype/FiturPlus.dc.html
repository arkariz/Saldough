<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Fitur Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,payments,photo_camera,progress_activity,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><a class="tk-iconbtn" href="Paywall.dc.html" aria-label="{{t.back}}"><span class="tk-icon">arrow_back</span></a><h1 class="tk-topbar__title">{{t.title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 16px">
    <p class="tk-t-body" style="margin: 0 4px">{{t.intro}}</p>
    <div class="tk-list tk-list--icon" style="flex: none">
      <sc-for list="{{items}}" as="f" hint-placeholder-count="6"><div class="tk-row tk-row--wrap" style="align-items: flex-start; flex: none"><span class="tk-tile tk-tile--sm tk-tile--brandsoft" aria-hidden="true"><span class="tk-icon">{{f.icon}}</span></span><span class="tk-row__main"><span class="tk-row__title">{{f.title}}</span><span class="tk-row__sub" style="white-space: normal">{{f.text}}</span></span></div></sc-for>
    </div>
    <div class="tk-card" style="display: flex; gap: 12px; align-items: flex-start; flex: none"><span class="tk-icon tk-ink-2" aria-hidden="true">check_circle</span><div class="tk-stat"><span class="tk-t-body-strong">{{t.freeTitle}}</span><span class="tk-t-body-sm tk-ink-2">{{t.free}}</span></div></div>
  </main>
  <div class="tk-sticky-action"><a class="tk-btn tk-btn--primary tk-btn--block" href="Paywall.dc.html">{{t.cta}}</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? {
      back: 'Back', title: 'What Plus does', intro: 'Tanuki does the work, so you spend less time recording and more time knowing where your money stands.', cta: 'See plans',
      freeTitle: 'Always free', free: 'Recording, History, Wallets, Budgets, recurring, 6 periods of Analysis, export, and manual backup.',
      items: [['photo_camera', 'Records for you', 'Photos of receipts and transfer slips, and notifications from every app, become entries. Fixed recurring bills record themselves.'], ['notifications_active', 'Keeps watch', 'A warning before a budget runs out or free money runs thin, plus a Monday summary.'], ['chat_bubble', 'Answers questions', 'Ask about your money in everyday words, typed or spoken.'], ['trending_up', 'Plans ahead', 'Try what if, set Goals with an expected date, and see 12 months ahead.'], ['summarize', 'Reports', 'Monthly reports with the story behind the numbers, a yearly tax summary, and Freelance Pro invoices.'], ['backup', 'Keeps safe', 'An automatic daily backup to your own Google Drive.']]
    } : {
      back: 'Kembali', title: 'Yang dikerjakan Plus', intro: 'Tanuki yang bekerja, jadi kamu tidak perlu banyak mengetik dan lebih tahu posisi uangmu.', cta: 'Lihat paket',
      freeTitle: 'Tetap gratis', free: 'Pencatatan, Riwayat, Dompet, Anggaran, rutin, Analisis 6 periode, ekspor, dan cadangan manual.',
      items: [['photo_camera', 'Mencatat untukmu', 'Foto struk dan bukti transfer, serta notifikasi dari semua aplikasi, jadi catatan. Rutin bernominal tetap tercatat sendiri.'], ['notifications_active', 'Berjaga', 'Peringatan sebelum anggaran habis atau uang nganggur menipis, plus Ringkasan Senin.'], ['chat_bubble', 'Menjawab pertanyaan', 'Tanya soal uangmu dalam bahasa sehari-hari, diketik atau lewat suara.'], ['trending_up', 'Merencanakan', 'Coba bagaimana kalau, buat Target dengan perkiraan tanggal tercapai, dan lihat 12 bulan ke depan.'], ['summarize', 'Melapor', 'Rapor bulanan yang bercerita, Rekap SPT tahunan, dan invoice Freelance Pro.'], ['backup', 'Menyimpan', 'Cadangan otomatis tiap hari ke Google Drive milikmu.']]
    };
    return { theme: this.props.dark ? 'dark' : 'light', t: T, items: T.items.map((i) => ({ icon: i[0], title: i[1], text: i[2] })) };
  }
}
</script>
</body>
</html>
