<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Freelance</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub">
    <a class="tk-iconbtn" href="Main.dc.html" aria-label="Kembali"><span class="tk-icon">arrow_back</span></a>
    <h1 class="tk-topbar__title">Freelance</h1>
    <button class="tk-iconbtn" type="button" aria-label="Tambah proyek"><span class="tk-icon">add</span></button>
  </header>

  <main class="tk-body tk-scroll" style="gap: 24px; padding: 0 16px 24px">
    <section style="display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 0">
      <p class="tk-t-body-sm tk-ink-2">Belum diterima</p>
      <p class="tk-amt tk-t-amount-hero"><span class="tk-amt__cur">Rp</span>3.600.000</p>
      <p class="tk-t-body-sm tk-ink-2">Diterima September <span class="tk-amt tk-t-amount-sm tk-c-positive">+Rp1.950.000</span></p>
    </section>

    <div class="tk-list">
      <div class="tk-row">
        <span class="tk-tile tk-tile--px"><img src="/_blob/95897b4a52c59923a6827c34f54f1967" alt="" width="32" height="32"></span>
        <span class="tk-row__main"><span class="tk-row__title">Tertunda</span><span class="tk-row__sub">1 tagihan · perkiraan 5 Okt</span></span>
        <span class="tk-row__end"><span class="tk-amt tk-t-amount">Rp2.700.000</span></span>
      </div>
      <div class="tk-row">
        <span class="tk-tile tk-tile--slate"><span class="tk-icon">schedule</span></span>
        <span class="tk-row__main"><span class="tk-row__title">Belum ditagih</span><span class="tk-row__sub">6 jam kerja</span></span>
        <span class="tk-row__end"><span class="tk-amt tk-t-amount">Rp900.000</span></span>
      </div>
    </div>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">Tagihan tertunda</h2></div>
      <div class="tk-card" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: flex-start; gap: 12px">
          <span class="tk-tile tk-tile--px"><img src="/_blob/6ec6bc4ed4a972490d3a4a21764dcbb6" alt="" width="32" height="32"></span>
          <span class="tk-row__main"><span class="tk-row__title">Redesain Toko Kopi</span><span class="tk-row__sub">18 jam · perkiraan 5 Okt</span></span>
          <span class="tk-row__end"><span class="tk-amt tk-t-amount">Rp2.700.000</span><span class="tk-badge tk-badge--warning"><span class="tk-icon">hourglass_top</span>Tertunda</span></span>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px">
          <button class="tk-btn tk-btn--text tk-btn--sm" type="button">Ubah tanggal</button>
          <button class="tk-btn tk-btn--primary tk-btn--sm" type="button">Catat diterima</button>
        </div>
      </div>
    </section>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">Proyek</h2><span class="tk-t-body-sm tk-ink-2">2 proyek</span></div>
      <div class="tk-list">
        <button class="tk-row" type="button">
          <span class="tk-tile tk-tile--px"><img src="/_blob/7b29d1c27de82a7878980c9785ed0d08" alt="" width="32" height="32"></span>
          <span class="tk-row__main"><span class="tk-row__title">Redesain Toko Kopi</span><span class="tk-row__sub">Rp150.000/jam · 24 jam</span></span>
          <span class="tk-row__end"><span class="tk-amt tk-t-amount">Rp3.600.000</span><span class="tk-t-caption tk-ink-2">belum diterima</span></span>
        </button>
        <button class="tk-row" type="button">
          <span class="tk-tile tk-tile--px"><img src="/_blob/7b29d1c27de82a7878980c9785ed0d08" alt="" width="32" height="32"></span>
          <span class="tk-row__main"><span class="tk-row__title">Studio Koding</span><span class="tk-row__sub">Rp200.000/jam · 10 jam</span></span>
          <span class="tk-row__end"><span class="tk-badge tk-badge--positive"><span class="tk-icon">check</span>Lunas</span></span>
        </button>
      </div>
    </section>
  </main>

  <div class="tk-sticky-action">
    <button class="tk-btn tk-btn--primary tk-btn--block" type="button"><span class="tk-icon">schedule</span>Catat jam kerja</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
