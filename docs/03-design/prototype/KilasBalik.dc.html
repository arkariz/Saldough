<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kilas balik September</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="rencana.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,arrow_downward,arrow_upward,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
.lb { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 16px; row-gap: 8px; align-items: baseline; font-size: 14px; line-height: 20px; }
.lb .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lb .h { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.lb .tot { font-weight: 700; font-size: 16px; line-height: 24px; }
.lb hr { grid-column: 1 / -1; margin: 2px 0; }
</style>
</helmet>
<div class="tk" data-theme="{{theme}}" style="position: relative; width: 360px; height: 800px; overflow: hidden; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <dc-import name="Main" dark="{{dark}}" hint-size="360px,800px"></dc-import>
  <a class="tk-scrim" href="Main.dc.html" aria-label="{{t.close}}"></a>
  <div class="tk-sheet" role="dialog" aria-label="{{t.title}}" style="position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: 8px">
    <div class="tk-sheet__handle"></div>
    <div class="tk-sheet__head"><a class="tk-iconbtn" href="Main.dc.html" aria-label="{{t.close}}"><span class="tk-icon">close</span></a><h2 class="tk-sheet__title">{{t.title}}</h2><span style="width: 48px; flex: none"></span></div>
    <div class="lb">
      <span></span><span class="n h">{{t.plan}}</span><span class="n h">{{t.actual}}</span>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <span class="tk-ink-2">{{r.label}}</span><span class="n tk-amt">{{r.plan}}</span><span class="n tk-amt">{{r.actual}}</span>
      </sc-for>
      <hr class="tk-divider">
      <span class="tot">{{t.free}}</span><span class="n tk-amt tot">{{freePlan}}</span><span class="n tk-amt tot">{{freeActual}}</span>
    </div>
    <p class="tk-t-body-sm tk-ink-2" style="margin-top: 12px">{{t.biggest}}</p>
    <hr class="tk-divider" style="margin: 12px 0 0">
    <div style="padding: 4px 0">
      <a class="tk-link" href="#analisis-september" style="margin: 0 -4px; padding: 14px 4px">{{t.see}}<span class="tk-icon tk-icon--sm">chevron_right</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"hidden":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en, hid = !!this.props.hidden;
    // September 2026, mulai tanggal 1 (FINANCIAL_ANALYSIS §10). Nyata pengeluaran: rutin 6.577.200 + anggaran 3.068.500 + di luar rencana 1.775.000 = 11.420.700.
    const T = en
      ? { title: 'September look back', plan: 'Plan', actual: 'Actual', free: 'Free money', biggest: 'Biggest difference: Income.', see: 'See September details', close: 'Close',
          rows: ['Income', 'Recurring bills', 'Budgets', 'Off plan'] }
      : { title: 'Kilas balik September', plan: 'Rencana', actual: 'Nyata', free: 'Uang nganggur', biggest: 'Selisih terbesar: Pemasukan.', see: 'Lihat rincian September', close: 'Tutup',
          rows: ['Pemasukan', 'Tagihan rutin', 'Anggaran', 'Di luar rencana'] };
    const v = (x) => hid ? 'Rp•••••' : x;
    const nums = [['Rp12.000.000', 'Rp14.615.438'], ['Rp5.879.000', 'Rp6.577.200'], ['Rp3.068.500', 'Rp3.068.500'], ['Rp0', 'Rp1.775.000']];
    return {
      theme: this.props.dark ? 'dark' : 'light',
      dark: !!this.props.dark,
      t: T,
      rows: nums.map((n, i) => ({ label: T.rows[i], plan: v(n[0]), actual: v(n[1]) })),
      freePlan: v('Rp3.052.500'),
      freeActual: v('Rp3.194.738')
    };
  }
}
</script>
</body>
</html>
