<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lembar ekspor</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,cloud_done,credit_card,dark_mode,delete,description,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,settings_backup_restore,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,table_view,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk" data-theme="{{theme}}" style="position: relative; width: 360px; height: 800px; overflow: hidden; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <sc-if value="{{underRiwayat}}" hint-placeholder-val="{{false}}"><dc-import name="Riwayat" dark="{{dark}}" hint-size="360px,800px"></dc-import></sc-if>
  <sc-if value="{{underAkun}}" hint-placeholder-val="{{true}}"><dc-import name="AkunData" en="{{en}}" dark="{{dark}}" cadangan="{{cad}}" hint-size="360px,800px"></dc-import></sc-if>
  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
    <button class="tk-scrim" type="button" aria-label="{{t.close}}" onClick="{{close}}" style="border: 0; padding: 0; cursor: pointer"></button>
    <div class="tk-sheet" role="dialog" aria-modal="true" aria-labelledby="ds-title" style="position: absolute; left: 0; right: 0; bottom: 0">
      <div class="tk-sheet__handle"></div>
      <div class="tk-sheet__head">
        <button class="tk-iconbtn" type="button" aria-label="{{t.close}}" onClick="{{close}}"><span class="tk-icon">close</span></button>
        <h2 class="tk-sheet__title" id="ds-title">{{t.title}}</h2>
        <span style="width: 48px; flex: none"></span>
      </div>
      <div style="padding: 0 0 4px">
        <sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
          <div class="tk-dsheet">
            <div class="tk-dsheet__group">
              <p class="tk-dsheet__label" id="ex-format">{{t.format}}</p>
              <div class="tk-seg" role="radiogroup" aria-labelledby="ex-format">
                <button class="tk-seg__opt {{f0.cls}}" type="button" role="radio" aria-checked="{{f0.checked}}" onClick="{{f0.pick}}">{{t.xlsx}}</button>
                <button class="tk-seg__opt {{f1.cls}}" type="button" role="radio" aria-checked="{{f1.checked}}" onClick="{{f1.pick}}">{{t.csv}}</button>
              </div>
              <p class="tk-field__help">{{fmtHelp}}</p>
            </div>
            <div class="tk-dsheet__sum {{sumCls}}" role="status"><span class="tk-icon" aria-hidden="true">{{sumIcon}}</span><span>{{sumText}}</span></div>
            <sc-if value="{{hasNote}}" hint-placeholder-val="{{true}}"><p class="tk-dsheet__note"><span class="tk-icon" aria-hidden="true">info</span><span>{{t.scope}}</span></p></sc-if>
          </div>
          <div class="tk-dsheet__foot">
            <button class="tk-btn tk-btn--primary tk-btn--block {{goCls}}" type="button" onClick="{{go}}">{{t.go}}</button>
          </div>
        </sc-if>
        <sc-if value="{{isBusy}}" hint-placeholder-val="{{false}}">
          <div class="tk-dsheet">
            <div class="tk-dsheet__busy" role="status" aria-live="polite"><span class="tk-icon tk-icon--spin" aria-hidden="true">progress_activity</span><span>{{t.busy}}</span></div>
            <p class="tk-dsheet__note"><span class="tk-icon" aria-hidden="true">info</span><span>{{t.busyNote}}</span></p>
          </div>
          <div class="tk-dsheet__foot">
            <button class="tk-btn tk-btn--text tk-btn--block" type="button" onClick="{{cancel}}">{{t.cancel}}</button>
          </div>
        </sc-if>
        <sc-if value="{{isReady}}" hint-placeholder-val="{{false}}">
        <div class="tk-dsheet">
          <div class="tk-dsheet__ok">
            <span class="tk-tile tk-tile--lg tk-tile--brandsoft"><span class="tk-icon">check_circle</span></span>
            <h3 class="tk-dsheet__ok-title">{{t.readyTitle}}</h3>
          </div>
          <div class="tk-file"><span class="tk-tile tk-tile--sm tk-tile--app"><span class="tk-icon">description</span></span><span class="tk-file__main"><span class="tk-file__name">{{file.name}}</span><span class="tk-file__meta">{{file.meta}}</span></span></div>
          <sc-if value="{{cancelled}}" hint-placeholder-val="{{false}}"><p class="tk-dsheet__note" role="status"><span class="tk-icon" aria-hidden="true">info</span><span>{{t.notSaved}}</span></p></sc-if>
        </div>
        <div class="tk-dsheet__foot">
          <button class="tk-btn tk-btn--primary tk-btn--block" type="button" onClick="{{saveTo}}">{{t.saveTo}}</button>
          <button class="tk-btn tk-btn--secondary tk-btn--block" type="button" onClick="{{share}}">{{t.share}}</button>
        </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"keadaan":{"editor":"enum","options":["awal","kosong","proses","siap"],"default":"awal","section":"Keadaan"},"format":{"editor":"enum","options":["xlsx","csv"],"default":"xlsx","section":"Keadaan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const en = !!this.props.en;
    const T = en ? {
      title: 'Export to spreadsheet', close: 'Close', format: 'Format', xlsx: 'Excel (.xlsx)', csv: 'CSV',
      xlsxHelp: 'Opens correctly in Excel and Google Sheets. Includes a Wallets sheet.', csvHelp: 'For other apps. Transactions only.',
      scope: 'Includes all your transactions and your current wallet balances. Filter what you need in the spreadsheet.',
      go: 'Export', busy: 'Preparing the file…', busyNote: 'This can take a while if you have a lot of data. You can cancel.', cancel: 'Cancel',
      readyTitle: 'File ready', saveTo: 'Save to…', share: 'Share', notSaved: '', empty: 'No transactions to export yet.',
      sum: (n, a, b) => n + (n === 1 ? ' transaction, ' : ' transactions, ') + a + ' – ' + b
    } : {
      title: 'Ekspor ke spreadsheet', close: 'Tutup', format: 'Format', xlsx: 'Excel (.xlsx)', csv: 'CSV',
      xlsxHelp: 'Terbuka benar di Excel dan Google Sheets. Memuat lembar Dompet.', csvHelp: 'Untuk aplikasi lain. Hanya transaksi.',
      scope: 'Berisi seluruh transaksimu dan saldo dompet saat ini. Saring sendiri bagian yang kamu perlukan di spreadsheet.',
      go: 'Ekspor', busy: 'Menyiapkan berkas…', busyNote: 'Ini bisa memakan waktu kalau datamu banyak. Kamu bisa membatalkannya.', cancel: 'Batal',
      readyTitle: 'Berkas siap', saveTo: 'Simpan ke…', share: 'Bagikan', notSaved: '', empty: 'Belum ada transaksi untuk diekspor.',
      sum: (n, a, b) => n + ' transaksi, ' + a + ' – ' + b
    };
    const mon = en ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] : ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des'];
    // Contoh: hari ini 22 Okt 2026, 142 transaksi, pencatatan pertama 3 Jun 2026. Selalu seluruh data saat ini.
    const empty = this.props.keadaan === 'kosong';
    const n = empty ? 0 : 142;
    const fmt = s.fmt || this.props.format || 'xlsx';
    const phase = s.phase || (this.props.keadaan === 'proses' ? 'busy' : this.props.keadaan === 'siap' ? 'ready' : 'form');
    const timer = () => setTimeout(() => this.setState({ phase: 'ready' }), 1400);
    return {
      theme: this.props.dark ? 'dark' : 'light', t: T, en: en, dark: !!this.props.dark, cad: 'belum',
      underRiwayat: false, underAkun: true,
      open: !s.closed, close: () => this.setState({ closed: true }),
      isForm: phase === 'form', isBusy: phase === 'busy', isReady: phase === 'ready',
      f0: { cls: fmt === 'xlsx' ? 'is-selected' : '', checked: fmt === 'xlsx' ? 'true' : 'false', pick: () => this.setState({ fmt: 'xlsx' }) },
      f1: { cls: fmt === 'csv' ? 'is-selected' : '', checked: fmt === 'csv' ? 'true' : 'false', pick: () => this.setState({ fmt: 'csv' }) },
      fmtHelp: fmt === 'xlsx' ? T.xlsxHelp : T.csvHelp, hasNote: !empty,
      sumCls: empty ? 'is-empty' : '', sumIcon: empty ? 'event_busy' : 'table_view', sumText: empty ? T.empty : T.sum(n, '3 ' + mon[5], '22 ' + mon[9] + ' 2026'),
      goCls: empty ? 'is-disabled' : '', go: () => { if (empty) return; this.setState({ phase: 'busy' }); timer(); },
      cancel: () => this.setState({ phase: 'form' }),
      file: { name: 'tanukonomy-' + (en ? 'export' : 'ekspor') + '-2026-10-22.' + (fmt === 'xlsx' ? 'xlsx' : 'csv'), meta: (fmt === 'xlsx' ? 'Excel' : 'CSV') + ' · ' + n + (en ? ' transactions' : ' transaksi') },
      cancelled: false,
      saveTo: () => this.setState({ closed: true }), share: () => this.setState({ closed: true })
    };
  }
}
</script>
</body>
</html>
