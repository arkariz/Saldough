<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub">
    <a class="tk-iconbtn" href="Main.dc.html" aria-label="{{t.qsClose}}"><span class="tk-icon">close</span></a>
  </header>
  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 16px">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
      <h1 class="tk-onb__title">{{t.qsTitle}}</h1>
      <p class="tk-onb__text">{{t.qsBody}}</p>
    </div>
    <sc-if value="{{hasApps}}" hint-placeholder-val="{{true}}">
      <div class="tk-list tk-list--check" style="flex: none">
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
          <label class="tk-row tk-row--check tk-row--compact">
            <span class="tk-check"><input type="checkbox" checked="{{a.on}}" onChange="{{a.toggle}}" aria-label="{{a.name}}"><span class="tk-check__box"><span class="tk-icon">check</span></span></span>
            <span class="tk-tile tk-tile--app">{{a.code}}</span>
            <span class="tk-row__main"><span class="tk-row__title">{{a.name}}</span><span class="tk-row__sub">{{t.qsBuiltIn}}</span></span>
          </label>
        </sc-for>
      </div>
    </sc-if>
    <a class="tk-list" href="Akun.dc.html" style="flex: none">
      <span class="tk-row tk-row--compact"><span class="tk-icon tk-ink-2">more_horiz</span><span class="tk-row__main"><span class="tk-row__title">{{t.qsOther}}</span></span><span class="tk-icon tk-row__chev">chevron_right</span></span>
    </a>
    <sc-if value="{{showStatus}}" hint-placeholder-val="{{false}}">
      <div class="tk-card" style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px" role="status">
        <span class="tk-t-body-sm">{{t.nzManage}}</span><span class="tk-badge tk-badge--warning">{{t.st.perm}}</span>
      </div>
    </sc-if>
  </main>
  <sc-if value="{{hasApps}}" hint-placeholder-val="{{true}}">
    <div class="tk-sticky-action">
      <a class="tk-btn tk-btn--primary tk-btn--block {{btnCls}}" href="BerandaNotifAktif.dc.html" aria-disabled="{{btnOff}}">{{btnLabel}}</a>
    </div>
  </sc-if>
</div>

class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = S[en ? 'en' : 'id'];
    const s = this.state || {};
    const k = this.props.keadaan || 'awal';
    const off = s.off || {};
    const all = [{ id: 'bca', code: 'BCA', name: en ? 'BCA mobile' : 'BCA mobile' }, { id: 'gp', code: 'GP', name: 'GoPay' }, { id: 'dn', code: 'DA', name: 'DANA' }];
    const apps = all.map((a) => Object.assign({}, a, { on: !off[a.id], toggle: () => this.setState({ off: Object.assign({}, off, { [a.id]: !off[a.id] }) }) }));
    const n = apps.filter((a) => a.on).length;
    const hasApps = k !== 'tanpa';
    return {
      theme: this.props.dark ? 'dark' : 'light', t: t, apps: apps, hasApps: hasApps,
      showStatus: k === 'izin',
      // sesudah kembali tanpa memberi izin: tombol menjadi Izinkan
      btnLabel: k === 'izin' ? t.allow : t.turnOn,
      btnOff: n === 0 ? 'true' : 'false', btnCls: n === 0 ? 'is-disabled' : ''
    };
  }
}
