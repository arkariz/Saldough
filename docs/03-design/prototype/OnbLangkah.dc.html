<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Onboarding, langkah wajib</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
body{margin:0}

<div class="tk tk-onb" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink)">
  <div class="tk-onb__top">
    <span class="tk-onb__brand">{{t.brand}}</span>
    <a class="tk-btn tk-btn--text" href="{{backHref}}">{{t.back}}</a>
  </div>

  <sc-if value="{{isPeriod}}" hint-placeholder-val="{{true}}">
    <div class="tk-onb__body">
      <div class="tk-card">
        <h1 class="tk-onb__title">{{t.perTitle}}</h1>
        <p class="tk-onb__text" style="margin-top: 8px">{{t.perBody}}</p>
      </div>
      <div class="tk-card" style="padding: 8px">
        <div class="tk-daygrid" role="radiogroup" aria-label="{{t.perTitle}}">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="28">
            <button class="tk-day {{d.cls}}" type="button" role="radio" aria-checked="{{d.checked}}" aria-label="{{d.aria}}" onClick="{{d.pick}}"><span class="tk-day__n">{{d.n}}</span></button>
          </sc-for>
          <button class="tk-day tk-day--wide {{last.cls}}" type="button" role="radio" aria-checked="{{last.checked}}" onClick="{{last.pick}}"><span class="tk-day__n">{{t.lastDay}}</span></button>
        </div>
      </div>
    </div>
    <div class="tk-onb__foot"><a class="tk-btn tk-btn--primary tk-btn--block" href="OnbPengingat.dc.html">{{perConfirm}}</a></div>
  </sc-if>

  <sc-if value="{{isAsk}}" hint-placeholder-val="{{false}}">
    <div class="tk-onb__body">
      <div class="tk-card" style="display: flex; flex-direction: column; gap: 12px">
        <img class="tk-onb__art" src="/_blob/e125ca20c3187e5fa60212f92f671be1" alt="" style="height: 120px">
        <h1 class="tk-onb__title">{{t.remTitle}}</h1>
        <p class="tk-onb__text">{{t.remBody}}</p>
        <sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
          <div class="tk-onb__status" role="status"><span>{{t.rowRem}}</span><span class="{{badgeCls}}">{{badgeText}}</span></div>
        </sc-if>
      </div>
    </div>
    <div class="tk-onb__foot">
      <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
        <button class="tk-btn tk-btn--primary tk-btn--block" type="button" onClick="{{turnOn}}">{{t.turnOn}}</button>
        <a class="tk-btn tk-btn--secondary tk-btn--block" href="OnbPenutup.dc.html">{{t.notNow}}</a>
      </sc-if>
      <sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
        <a class="tk-btn tk-btn--primary tk-btn--block" href="OnbPenutup.dc.html">{{t.next}}</a>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isFinal}}" hint-placeholder-val="{{false}}">
    <div class="tk-onb__body">
      <img class="tk-onb__art" src="/_blob/789316f47a4dd97ba2f45230b1d4207f" alt="" style="height: 156px">
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
        <h1 class="tk-onb__title">{{t.finTitle}}</h1>
        <p class="tk-onb__text">{{t.finBody}}</p>
      </div>
      <div class="tk-list" aria-label="{{t.brand}}">
        <sc-for list="{{summary}}" as="r" hint-placeholder-count="2">
          <div class="tk-row tk-row--compact tk-row--wrap"><span class="tk-icon tk-ink-2">{{r.icon}}</span><span class="tk-row__main"><span class="tk-row__title">{{r.title}}</span></span><span class="{{r.cls}}">{{r.text}}</span></div>
        </sc-for>
      </div>
      <sc-if value="{{showInfo}}" hint-placeholder-val="{{true}}">
        <div class="tk-onb__info"><span class="tk-icon tk-ink-2" aria-hidden="true">notifications</span><span class="tk-onb__text">{{t.notInfo}}</span></div>
      </sc-if>
    </div>
    <div class="tk-onb__foot">
      <a class="tk-btn tk-btn--primary tk-btn--block" href="Dompet.dc.html">{{t.addWallet}}</a>
      <a class="tk-btn tk-btn--text tk-btn--block" href="Main.dc.html">{{t.later}}</a>
      <a class="tk-btn tk-btn--text tk-btn--block" href="Akun.dc.html">{{t.signIn}}</a>
    </div>
  </sc-if>
</div>
</x-dc>

const S = {

};const BCLS = {"on": "tk-badge tk-badge--positive", "off": "tk-badge", "perm": "tk-badge tk-badge--warning"};
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = S[en ? 'en' : 'id'];
    const s = this.state || {};
    const step = this.props.langkah || 'period';
    const fill = (str, d) => str.replace('{d}', d);
    const pick = s.pick !== undefined ? s.pick : (this.props.pilih || '1');
    const k = s.k || this.props.keadaan || 'awal';
    const out = { theme: this.props.dark ? 'dark' : 'light', t: t,
      isPeriod: step === 'period', isAsk: step === 'reminder', isFinal: step === 'final' };
    out.days = Array.from({ length: 28 }, (_, i) => ({ n: String(i + 1), cls: String(pick) === String(i + 1) ? 'is-selected' : '',
      checked: String(pick) === String(i + 1) ? 'true' : 'false', aria: fill(t.dayAria, i + 1), pick: () => this.setState({ pick: String(i + 1) }) }));
    out.last = { cls: pick === 'last' ? 'is-selected' : '', checked: pick === 'last' ? 'true' : 'false', pick: () => this.setState({ pick: 'last' }) };
    out.perConfirm = pick === 'last' ? t.perConfirmLast : fill(t.perConfirm, pick);
    // langkah pengingat: awal, nyala, izin (izin ditolak); belum = kembali tanpa menyelesaikan (Mati)
    out.asking = k === 'awal';
    out.answered = k !== 'awal';
    const sk = k === 'nyala' ? 'on' : (k === 'izin' ? 'perm' : 'off');
    out.badgeCls = BCLS[sk];
    out.badgeText = t.st[sk];
    out.turnOn = () => this.setState({ k: 'nyala' });
    out.backHref = step === 'period' ? '#' : step === 'reminder' ? 'OnbLangkah.dc.html' : 'OnbPengingat.dc.html';
    // penutup: ringkasan dua pilihan + baris informasi Catat dari notifikasi (Android, tidak dapat diketuk)
    const r = this.props.ingat || 'izin';
    const map = { nyala: 'on', mati: 'off', izin: 'perm' };
    out.summary = [
      { icon: 'calendar_today', title: t.rowPer, text: pick === 'last' ? t.perValueLast : fill(t.perValue, pick), cls: 'tk-t-body-sm tk-ink-2' },
      { icon: 'alarm', title: t.rowRem, text: t.st[map[r]], cls: BCLS[map[r]] }
    ];
    out.showInfo = !this.props.ios;
    return out;
  }
}

</html>
