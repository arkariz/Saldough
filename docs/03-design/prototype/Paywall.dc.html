<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Paywall Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,open_in_new,payments,photo_camera,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk" data-theme="{{theme}}" style="position: relative; width: 360px; height: 800px; overflow: hidden; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <dc-import name="Main" banner="tidak" dark="{{dark}}" hint-size="360px,800px"></dc-import>
  <button class="tk-scrim" type="button" aria-label="{{t.close}}" style="border: 0; padding: 0"></button>
  <div class="tk-pw" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <div class="tk-pw__top"><a class="tk-iconbtn" href="Main.dc.html" aria-label="{{t.close}}"><span class="tk-icon">close</span></a></div>
    <div class="tk-pw__body tk-scroll">
      <div class="tk-pw__hero">
        <span class="tk-tile tk-tile--brandsoft" aria-hidden="true"><span class="tk-icon">workspace_premium</span></span>
        <h1 class="tk-pw__title" id="pw-title">{{title}}</h1>
        <p class="tk-pw__sub">{{sub}}</p>
      </div>
      <sc-if value="{{hasBanner}}" hint-placeholder-val="{{false}}"><div class="{{bannerCls}}" role="status"><span class="tk-icon" aria-hidden="true">{{bannerIcon}}</span><span class="tk-banner__text">{{bannerText}}</span></div></sc-if>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p class="tk-pw__label">{{t.pillarsLabel}}</p>
        <ul class="tk-pillars">
          <sc-for list="{{pillars}}" as="p" hint-placeholder-count="6"><li class="tk-pillar {{p.cls}}"><span class="tk-icon" aria-hidden="true">{{p.icon}}</span><span>{{p.title}}</span></li></sc-for>
        </ul>
      </div>
      <sc-if value="{{hasLead}}" hint-placeholder-val="{{true}}"><p class="tk-pw__lead">{{leadText}}</p></sc-if>
      <sc-if value="{{isPlans}}" hint-placeholder-val="{{true}}">
        <div class="tk-plans" role="radiogroup" aria-label="{{t.plansLabel}}">
          <sc-for list="{{plans}}" as="pl" hint-placeholder-count="2">
            <button class="tk-plan {{pl.cls}}" type="button" role="radio" aria-checked="{{pl.checked}}" onClick="{{pl.pick}}">
              <span class="tk-plan__radio" aria-hidden="true"></span>
              <span class="tk-plan__main"><span class="tk-plan__title">{{pl.name}}<sc-if value="{{pl.hasTag}}" hint-placeholder-val="{{false}}"><span class="tk-badge tk-badge--plus">{{pl.tag}}</span></sc-if></span><span class="tk-plan__sub">{{pl.sub}}</span></span>
              <sc-if value="{{pl.hasPrice}}" hint-placeholder-val="{{true}}"><span class="tk-plan__price"><sc-if value="{{pl.hasWas}}" hint-placeholder-val="{{false}}"><span class="tk-plan__was">{{pl.was}}</span></sc-if><span>{{pl.price}}</span><span class="tk-plan__unit">{{pl.unit}}</span></span></sc-if>
              <sc-if value="{{pl.skel}}" hint-placeholder-val="{{false}}"><span class="tk-skel tk-plan__skel" aria-hidden="true"></span></sc-if>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{isOffline}}" hint-placeholder-val="{{false}}">
        <div class="tk-card" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
          <span class="tk-tile tk-tile--lg tk-tile--app" aria-hidden="true"><span class="tk-icon">wifi_off</span></span>
          <h2 class="tk-lock__title">{{t.offTitle}}</h2>
          <p class="tk-lock__text">{{t.offBody}}</p>
          <button class="tk-btn tk-btn--secondary" type="button">{{t.retry}}</button>
        </div>
      </sc-if>
      <p class="tk-pw__note"><span class="tk-icon" aria-hidden="true">lock</span><span>{{t.keep}}</span></p>
      <button class="tk-btn tk-btn--text tk-btn--block tk-btn--sm" type="button">{{t.restore}}</button>
    </div>
    <div class="tk-pw__foot">
      <sc-if value="{{buyLink}}" hint-placeholder-val="{{true}}"><a class="tk-btn tk-btn--primary tk-btn--block" href="PlusBerhasil.dc.html">{{buyLabel}}</a></sc-if>
      <sc-if value="{{buyBusy}}" hint-placeholder-val="{{false}}"><button class="tk-btn tk-btn--primary tk-btn--block" type="button" disabled><span class="tk-icon tk-icon--spin" aria-hidden="true">progress_activity</span>{{buyLabel}}</button></sc-if>
      <sc-if value="{{buyOff}}" hint-placeholder-val="{{false}}"><button class="tk-btn tk-btn--primary tk-btn--block is-disabled" type="button" disabled>{{buyLabel}}</button></sc-if>
      <sc-if value="{{buyRetry}}" hint-placeholder-val="{{false}}"><button class="tk-btn tk-btn--primary tk-btn--block" type="button">{{buyLabel}}</button></sc-if>
      <a class="tk-btn tk-btn--secondary tk-btn--block" href="Main.dc.html">{{t.later}}</a>
      <p class="tk-pw__fine">{{fine}}</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pemicu":{"editor":"enum","options":["P1","P2","P3","P4","P5","P6","P7","P8","P9","P10"],"default":"P1","section":"Keadaan"},"keadaan":{"editor":"enum","options":["awal","memuat","luring","memproses","tertunda","galat"],"default":"awal","section":"Keadaan"},"penawaran":{"editor":"enum","options":["biasa","pendiri","pasca"],"default":"biasa","section":"Keadaan"},"paket":{"editor":"enum","options":["annual","monthly"],"default":"annual","section":"Keadaan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const en = !!this.props.en;
    const T = en ? {
      close: 'Close', later: 'Not now', restore: 'Restore purchases', keep: 'All your records stay yours, subscribed or not.',
      pillarsLabel: 'What Plus does', plansLabel: 'Plans', annual: 'Yearly', monthly: 'Monthly', perYear: '/year', perMonth: '/month',
      equiv: 'about Rp14,900 a month', cancelAny: 'Cancel anytime', founder: 'Founder price', intro: 'Intro price',
      founderSub: 'Locked while subscribed · until 21 Jan 2027', introSub: 'First year, then Rp179,000 a year · until 26 Nov, 9:00 pm',
      buy: (p) => 'Subscribe ' + (p === 'annual' ? 'yearly' : 'monthly'), buying: 'Processing…', waiting: 'Waiting for approval', loadingBuy: 'Subscribe', retryBuy: 'Try again',
      fine: (p, price) => price + (p === 'annual' ? ' per year' : ' per month') + ', renews automatically. Cancel anytime in the Play Store.',
      offTitle: 'Prices could not load', offBody: 'Connect to the internet to see the prices, then try again.', retry: 'Try again',
      pending: 'Payment pending. Plus turns on as soon as it is approved.', failed: 'Payment did not go through. Check your payment method in the Play Store, then try again.',
      pillarsLabel2: 'Tanuki works for you', pillars: [['photo_camera', 'Records', 'Photos and notifications from every app become entries'], ['notifications_active', 'Keeps watch', 'Warnings before a budget runs out, and the Monday summary'], ['chat_bubble', 'Answers', 'Ask about your money in everyday words'], ['trending_up', 'Plans', 'What if, Goals, a 12-month forecast'], ['summarize', 'Reports', 'Storytelling reports, tax summary, Freelance Pro'], ['backup', 'Keeps safe', 'Daily backup to your own Google Drive']],
      trig: {
        P1: ['30 smart readings are used up this month', 'With Plus, photos and readings have no quota.', 0], P2: ['Your main bank is already recorded from notifications', 'Add GoPay and other apps with Plus.', 0],
        P3: ['This warning came 9 days before the Food budget ran out', 'Plus tells you every time something like this comes up.', 1], P4: ['Keep this question and answer it now', 'This month\'s 3 questions are used up.', 2],
        P5: ['See the next 12 months', 'And try what if a new installment comes along.', 3], P6: ['Your period report is ready', 'Plus opens it in full, with the story behind the numbers.', 4],
        P7: ['Client A has not paid in 21 days', 'Create an invoice and track its due date with Plus.', 4], P8: ['200 of your entries exist only on this phone', 'Back up now (free), or let Plus back up every day.', 5],
        P9: ['Your 2026 tax summary is ready to prepare', 'Plus puts the year\'s income in one place.', 4], P10: ['Tanukonomy Plus', 'Tanuki works for you.', -1]
      }
    } : {
      close: 'Tutup', later: 'Nanti saja', restore: 'Pulihkan pembelian', keep: 'Semua catatanmu tetap milikmu, berlangganan atau tidak.',
      pillarsLabel: 'Yang dikerjakan Plus', plansLabel: 'Paket', annual: 'Tahunan', monthly: 'Bulanan', perYear: '/tahun', perMonth: '/bulan',
      equiv: 'setara Rp14.900/bulan', cancelAny: 'Bisa dibatalkan kapan saja', founder: 'Harga Pendiri', intro: 'Harga perkenalan',
      founderSub: 'Terkunci selagi berlangganan · sampai 21 Jan 2027', introSub: 'Tahun pertama, lalu Rp179.000/tahun · sampai 26 Nov, 21.00',
      buy: (p) => 'Berlangganan ' + (p === 'annual' ? 'Tahunan' : 'Bulanan'), buying: 'Memproses…', waiting: 'Menunggu persetujuan', loadingBuy: 'Berlangganan', retryBuy: 'Coba lagi',
      fine: (p, price) => price + (p === 'annual' ? ' per tahun' : ' per bulan') + ', diperpanjang otomatis. Batalkan kapan saja di Play Store.',
      offTitle: 'Harga belum bisa dimuat', offBody: 'Sambungkan ke internet untuk melihat harga, lalu coba lagi.', retry: 'Coba lagi',
      pending: 'Pembayaran tertunda. Plus aktif begitu disetujui.', failed: 'Pembayaran belum berhasil. Cek metode bayarmu di Play Store, lalu coba lagi.',
      pillarsLabel2: 'Tanuki bekerja untukmu', pillars: [['photo_camera', 'Mencatat', 'Foto dan notifikasi semua aplikasi jadi catatan'], ['notifications_active', 'Berjaga', 'Peringatan sebelum anggaran habis dan Ringkasan Senin'], ['chat_bubble', 'Menjawab', 'Tanya soal uangmu dalam bahasa sehari-hari'], ['trending_up', 'Merencanakan', 'Bagaimana kalau, Target, perkiraan 12 bulan'], ['summarize', 'Melapor', 'Rapor bercerita, Rekap SPT, Freelance Pro'], ['backup', 'Menyimpan', 'Cadangan harian ke Google Drive milikmu']],
      trig: {
        P1: ['30 tafsir bulan ini sudah terpakai', 'Dengan Plus, foto dan tafsir tanpa kuota.', 0], P2: ['Bank utamamu sudah tercatat dari notifikasi', 'Tambah GoPay dan aplikasi lain dengan Plus.', 0],
        P3: ['Peringatan ini datang 9 hari sebelum anggaran Makan habis', 'Plus memberi tahu tiap kali ada yang seperti ini.', 1], P4: ['Simpan pertanyaan ini dan jawab sekarang', 'Jatah 3 pertanyaan bulan ini sudah terpakai.', 2],
        P5: ['Lihat 12 bulan ke depan', 'Coba juga bagaimana kalau ada cicilan baru.', 3], P6: ['Rapor periode ini sudah siap', 'Plus membukanya lengkap dengan ceritanya.', 4],
        P7: ['Klien A belum membayar 21 hari', 'Buat invoice dan pantau jatuh temponya dengan Plus.', 4], P8: ['200 catatanmu hanya ada di ponsel ini', 'Cadangkan sekarang (gratis), atau biarkan Plus mencadangkan tiap hari.', 5],
        P9: ['Rekap SPT 2026-mu sudah bisa disusun', 'Plus merapikan penghasilan setahun di satu tempat.', 4], P10: ['Tanukonomy Plus', 'Tanuki bekerja untukmu.', -1]
      }
    };
    const st = this.props.keadaan || 'awal';
    const offer = this.props.penawaran || 'biasa';
    const plan = s.plan || this.props.paket || 'annual';
    const tr = T.trig[this.props.pemicu || 'P1'];
    const price = (p) => {
      if (p === 'monthly') return { price: en ? 'Rp25,000' : 'Rp25.000', unit: T.perMonth, sub: T.cancelAny, tag: '', was: '' };
      if (offer === 'pendiri') return { price: en ? 'Rp129,000' : 'Rp129.000', unit: T.perYear, sub: T.founderSub, tag: T.founder, was: en ? 'Rp179,000' : 'Rp179.000' };
      if (offer === 'pasca') return { price: en ? 'Rp129,000' : 'Rp129.000', unit: T.perYear, sub: T.introSub, tag: T.intro, was: en ? 'Rp179,000' : 'Rp179.000' };
      return { price: en ? 'Rp179,000' : 'Rp179.000', unit: T.perYear, sub: T.equiv, tag: '', was: '' };
    };
    const loading = st === 'memuat', offline = st === 'luring';
    const busy = st === 'memproses', pending = st === 'tertunda', failed = st === 'galat';
    const plans = ['annual', 'monthly'].map((p) => {
      const pr = price(p);
      return {
        name: p === 'annual' ? T.annual : T.monthly, sub: loading ? T.cancelAny : pr.sub, tag: pr.tag, hasTag: !!pr.tag && !loading,
        price: pr.price, unit: pr.unit, hasPrice: !loading, was: pr.was, hasWas: !!pr.was && !loading, skel: loading,
        cls: (plan === p ? 'is-selected' : '') + (busy || pending ? ' is-disabled' : ''), checked: plan === p ? 'true' : 'false',
        pick: () => this.setState({ plan: p })
      };
    });
    const pr = price(plan);
    const pillars = T.pillars.map((p, i) => ({ icon: p[0], title: p[1], sub: p[2], cls: i === tr[2] ? 'is-lead' : '' }));
    const lead = T.pillars[tr[2]];
    const buyLabel = busy ? T.buying : pending ? T.waiting : loading || offline ? T.loadingBuy : failed ? T.retryBuy : T.buy(plan);
    return {
      theme: this.props.dark ? 'dark' : 'light', dark: !!this.props.dark, t: Object.assign({}, T, { pillarsLabel: T.pillarsLabel2 }), title: tr[0], sub: tr[1], pillars: pillars, plans: plans, hasLead: !!lead, leadText: lead ? lead[2] : '',
      isPlans: !offline, isOffline: offline, hasBanner: pending || failed, bannerCls: failed ? 'tk-banner tk-banner--danger' : 'tk-banner tk-banner--info',
      bannerIcon: failed ? 'error' : 'info', bannerText: failed ? T.failed : T.pending,
      buyLink: st === 'awal', buyBusy: busy, buyOff: loading || offline || pending, buyRetry: failed, buyLabel: buyLabel,
      fine: T.fine(plan, pr.price)
    };
  }
}
</script>
</body>
</html>
