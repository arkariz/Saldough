<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Plus aktif</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,payments,photo_camera,progress_activity,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk" data-theme="{{theme}}" style="position: relative; width: 360px; height: 800px; overflow: hidden; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <dc-import name="Main" banner="tidak" dark="{{dark}}" hint-size="360px,800px"></dc-import>
  <a class="tk-scrim" href="Main.dc.html" aria-label="{{t.close}}"></a>
  <div class="tk-sheet" role="dialog" aria-modal="true" aria-labelledby="ok-title" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <div class="tk-sheet__handle"></div>
    <span class="tk-tile tk-tile--lg tk-tile--brandsoft" aria-hidden="true" style="margin-top: 16px"><span class="tk-icon">workspace_premium</span></span>
    <h2 class="tk-sheet__title" id="ok-title" style="flex: none; font-size: 20px; line-height: 28px">{{t.title}}</h2>
    <p class="tk-t-body-sm tk-ink-2" style="margin: 0 8px 8px">{{t.body}}</p>
    <a class="tk-btn tk-btn--primary tk-btn--block" href="Main.dc.html">{{t.ok}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? { close: 'Close', title: 'Plus is on', body: 'Yearly plan, renews on 22 Oct 2027. Tanuki starts working for you.', ok: 'Done' }
      : { close: 'Tutup', title: 'Plus aktif', body: 'Paket Tahunan, diperpanjang 22 Okt 2027. Tanuki mulai bekerja untukmu.', ok: 'Selesai' };
    return { theme: this.props.dark ? 'dark' : 'light', dark: !!this.props.dark, t: T };
  }
}
</script>
</body>
</html>
