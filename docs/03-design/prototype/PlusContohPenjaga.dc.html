<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Contoh Penjaga</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,open_in_new,payments,photo_camera,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar"><h1 class="tk-topbar__title">{{t.home}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 12px; padding: 0 16px 32px">
    <sc-if value="{{isNotif}}" hint-placeholder-val="{{false}}">
      <p class="tk-t-body-sm tk-ink-2" style="margin: 0 4px">{{t.notifNote}}</p>
      <div class="tk-card" style="display: flex; gap: 12px; align-items: flex-start" role="img" aria-label="{{t.notifAria}}">
        <img src="/_blob/f544a8e4c6b6329a9497cbf4860ef099" alt="" width="40" height="32" style="image-rendering: pixelated; flex: none; margin-top: 2px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span class="tk-t-label tk-ink-2">Tanukonomy · {{t.sampleTag}} · {{t.now}}</span>
          <span class="tk-t-body-strong">{{t.warn}}</span>
          <span class="tk-t-body-sm tk-ink-2">{{t.warnSub}}</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
      <div class="tk-card" style="display: flex; flex-direction: column; gap: 4px"><span class="tk-t-body-sm tk-ink-2">{{t.total}}</span><span class="tk-amt tk-t-amount-hero">Rp27.522.000</span></div>
      <div class="tk-ctx" role="region" aria-label="{{t.sampleTag}}">
        <div class="tk-ctx__top"><span class="tk-tile tk-tile--sm tk-tile--brandsoft" aria-hidden="true"><span class="tk-icon">notifications_active</span></span><div class="tk-ctx__main"><span class="tk-badge tk-badge--plus-trial" style="align-self: flex-start">{{t.sampleTag}}</span><p class="tk-ctx__text" style="font-weight: 600">{{t.warn}}</p><p class="tk-t-body-sm tk-ink-2" style="margin: 0">{{t.warnSub}}</p></div></div>
        <div class="tk-ctx__actions"><button class="tk-btn tk-btn--text tk-btn--sm" type="button">{{t.close}}</button><a class="tk-btn tk-btn--secondary tk-btn--sm" href="RincianAnggaran.dc.html">{{t.see}}</a></div>
      </div>
    </sc-if>
    <sc-if value="{{isP3}}" hint-placeholder-val="{{false}}">
      <div class="tk-ctx" role="region" aria-label="P3">
        <div class="tk-ctx__top"><span class="tk-tile tk-tile--sm tk-tile--brandsoft" aria-hidden="true"><span class="tk-icon">workspace_premium</span></span><div class="tk-ctx__main"><span class="tk-t-label tk-ink-2">P3</span><p class="tk-ctx__text">{{t.p3}}</p></div></div>
        <div class="tk-ctx__actions"><button class="tk-btn tk-btn--text tk-btn--sm" type="button">{{t.later}}</button><a class="tk-btn tk-btn--primary tk-btn--sm" href="Paywall.dc.html?pemicu=P3">{{t.seePlus}}</a></div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tampil":{"editor":"enum","options":["beranda","notif","p3"],"default":"beranda","section":"Keadaan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? {
      home: 'Home', total: 'Total balance', sampleTag: 'Watcher sample', now: 'now', close: 'Close', see: 'See Food budget', later: 'Not now', seePlus: 'See Plus',
      warn: 'The Food budget is expected to run out 9 days before the period ends.', warnSub: 'You have spent 71% and 14 of 30 days have passed.',
      notifNote: 'Local notification. A real warning, once per period for Free, labeled as a sample.', notifAria: 'Notification',
      p3: 'This warning came 9 days before the Food budget ran out. Plus tells you every time something like this comes up.'
    } : {
      home: 'Beranda', total: 'Total saldo', sampleTag: 'Contoh Penjaga', now: 'sekarang', close: 'Tutup', see: 'Lihat anggaran Makan', later: 'Nanti saja', seePlus: 'Lihat Plus',
      warn: 'Anggaran Makan diperkirakan habis 9 hari sebelum periode berakhir.', warnSub: 'Terpakai 71%, padahal baru 14 dari 30 hari berjalan.',
      notifNote: 'Notifikasi lokal. Peringatan sungguhan, satu kali per periode untuk Gratis, berlabel contoh.', notifAria: 'Notifikasi',
      p3: 'Peringatan ini datang 9 hari sebelum anggaran Makan habis. Plus memberi tahu tiap kali ada yang seperti ini.'
    };
    const v = this.props.tampil || 'beranda';
    return { theme: this.props.dark ? 'dark' : 'light', t: T, isHome: v === 'beranda', isNotif: v === 'notif', isP3: v === 'p3' };
  }
}
</script>
</body>
</html>
