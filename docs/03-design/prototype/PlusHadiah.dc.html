<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hadiah uji coba Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,payments,photo_camera,progress_activity,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-onb" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink)">
  <div class="tk-onb__top"><span class="tk-onb__brand">Tanukonomy</span></div>
  <sc-if value="{{isAsk}}" hint-placeholder-val="{{false}}">
    <div class="tk-onb__body">
      <div class="tk-card"><h1 class="tk-onb__title">{{t.askTitle}}</h1><p class="tk-onb__text" style="margin-top: 8px">{{t.askBody}}</p></div>
      <div class="tk-card" style="padding: 8px">
        <div class="tk-daygrid" role="radiogroup" aria-label="{{t.askTitle}}">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="28"><button class="tk-day {{d.cls}}" type="button" role="radio" aria-checked="{{d.checked}}" aria-label="{{d.aria}}" onClick="{{d.pick}}"><span class="tk-day__n">{{d.n}}</span></button></sc-for>
          <button class="tk-day tk-day--wide {{last.cls}}" type="button" role="radio" aria-checked="{{last.checked}}" onClick="{{last.pick}}"><span class="tk-day__n">{{t.lastDay}}</span></button>
        </div>
      </div>
      <div class="tk-dsheet__sum" role="status"><span class="tk-icon" aria-hidden="true">workspace_premium</span><span>{{endLine}}</span></div>
    </div>
    <div class="tk-onb__foot"><a class="tk-btn tk-btn--primary tk-btn--block" href="PlusHadiah.dc.html">{{confirm}}</a></div>
  </sc-if>
  <sc-if value="{{isGift}}" hint-placeholder-val="{{true}}">
    <div class="tk-onb__body" style="justify-content: center">
      <img class="tk-onb__art" src="/_blob/789316f47a4dd97ba2f45230b1d4207f" alt="" style="height: 156px">
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
        <h1 class="tk-onb__title">{{giftTitle}}</h1>
        <p class="tk-onb__text">{{t.giftBody}}</p>
      </div>
    </div>
    <div class="tk-onb__foot"><a class="tk-btn tk-btn--primary tk-btn--block" href="OnbPenutup.dc.html">{{t.start}}</a></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"langkah":{"editor":"enum","options":["hadiah","gajian"],"default":"hadiah","section":"Keadaan"},"tanggal":{"editor":"enum","options":["1","10","15","25","last"],"default":"25","section":"Keadaan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const en = !!this.props.en;
    const T = en ? {
      askTitle: 'When is payday, usually?', askBody: 'Your Plus trial ends with your first financial period, so this date sets how long it lasts.', lastDay: 'Last day of the month',
      confirm: (d) => d === 'last' ? 'Use the last day of the month' : 'Use day ' + d, giftTitle: (d) => 'Plus is on until ' + d + ', the end of your first period.',
      giftBody: 'No card, no automatic subscription. After that you keep recording for free.', start: 'Start recording', end: (d) => 'Plus on until ' + d,
      mon: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
    } : {
      askTitle: 'Biasanya gajian tanggal berapa?', askBody: 'Uji coba Plus berakhir bersama periode keuangan pertamamu, jadi tanggal ini menentukan lamanya.', lastDay: 'Hari terakhir bulan',
      confirm: (d) => d === 'last' ? 'Pakai hari terakhir bulan' : 'Pakai tanggal ' + d, giftTitle: (d) => 'Plus aktif sampai ' + d + ', akhir periode pertamamu.',
      giftBody: 'Tanpa kartu, tanpa langganan otomatis. Sesudah itu kamu tetap mencatat gratis.', start: 'Mulai mencatat', end: (d) => 'Plus aktif sampai ' + d,
      mon: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des']
    };
    // KT-P2: berakhir di hari terakhir periode berjalan bila sisa >= 14 hari, selain itu periode berikutnya. Contoh: pasang 1 Nov.
    const pick = s.day || this.props.tanggal || '25';
    const endOf = (d) => { if (d === 'last') return [10, 29]; const n = parseInt(d, 10); if (n === 1) return [10, 30]; return n - 1 >= 14 ? [10, n - 1] : [11, n - 1]; };
    const e = endOf(pick);
    const endTxt = e[1] + ' ' + T.mon[e[0]];
    const days = []; for (let i = 1; i <= 28; i++) days.push(i);
    const mode = this.props.langkah || 'hadiah';
    return {
      theme: this.props.dark ? 'dark' : 'light', t: T, isAsk: mode === 'gajian', isGift: mode !== 'gajian',
      days: days.map((n) => ({ n: n, aria: (en ? 'Day ' : 'Tanggal ') + n, cls: String(n) === pick ? 'is-selected' : '', checked: String(n) === pick ? 'true' : 'false', pick: () => this.setState({ day: String(n) }) })),
      last: { cls: pick === 'last' ? 'is-selected' : '', checked: pick === 'last' ? 'true' : 'false', pick: () => this.setState({ day: 'last' }) },
      confirm: T.confirm(pick), endLine: T.end(endTxt), giftTitle: T.giftTitle(endTxt)
    };
  }
}
</script>
</body>
</html>
