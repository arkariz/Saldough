<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartu konteks Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,open_in_new,payments,photo_camera,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><a class="tk-iconbtn" href="Main.dc.html" aria-label="{{t.back}}"><span class="tk-icon">arrow_back</span></a><h1 class="tk-topbar__title">{{t.title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 12px; padding: 0 16px 32px">
    <p class="tk-t-body-sm tk-ink-2" style="margin: 0 4px">{{t.note}}</p>
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <div class="tk-ctx" role="region" aria-label="{{c.aria}}">
        <div class="tk-ctx__top"><span class="tk-tile tk-tile--sm tk-tile--brandsoft" aria-hidden="true"><span class="tk-icon">{{c.icon}}</span></span><div class="tk-ctx__main"><span class="tk-t-label tk-ink-2">{{c.trig}}</span><p class="tk-ctx__text">{{c.text}}</p></div></div>
        <div class="tk-ctx__actions"><button class="tk-btn tk-btn--text tk-btn--sm" type="button">{{t.later}}</button><a class="tk-btn tk-btn--primary tk-btn--sm" href="{{c.href}}">{{c.cta}}</a></div>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? {
      back: 'Back', title: 'Context card', later: 'Not now', note: 'Shows after something worked, never inside Record. One per screen, with your own numbers and one button.',
      cards: [['P1', 'After a receipt photo', 'photo_camera', '30 smart readings are used up this month. With Plus, photos and readings have no quota.', 'See Plus', 'Paywall.dc.html'],
              ['P7', 'Freelance project', 'work', 'Client A has not paid in 21 days. Create an invoice and track its due date with Plus.', 'See Plus', 'Paywall.dc.html?pemicu=P7'],
              ['P8', 'Home, no backup in 30 days', 'backup', '200 of your entries exist only on this phone. Back up now (free), or let Plus back up every day.', 'Back up now', 'LembarCadangkan.dc.html']]
    } : {
      back: 'Kembali', title: 'Kartu konteks', later: 'Nanti saja', note: 'Tampil sesudah sesuatu berhasil, tidak pernah di dalam CATAT. Satu per layar, dengan angka milikmu dan satu tombol.',
      cards: [['P1', 'Sesudah foto struk', 'photo_camera', '30 tafsir bulan ini sudah terpakai. Dengan Plus, foto dan tafsir tanpa kuota.', 'Lihat Plus', 'Paywall.dc.html'],
              ['P7', 'Proyek freelance', 'work', 'Klien A belum membayar 21 hari. Buat invoice dan pantau jatuh temponya dengan Plus.', 'Lihat Plus', 'Paywall.dc.html?pemicu=P7'],
              ['P8', 'Beranda, 30 hari tanpa cadangan', 'backup', '200 catatanmu hanya ada di ponsel ini. Cadangkan sekarang (gratis), atau biarkan Plus mencadangkan tiap hari.', 'Cadangkan sekarang', 'LembarCadangkan.dc.html']]
    };
    return { theme: this.props.dark ? 'dark' : 'light', t: T, cards: T.cards.map((c) => ({ trig: c[0] + ' · ' + c[1], aria: c[0], icon: c[2], text: c[3], cta: c[4], href: c[5] })) };
  }
}
</script>
</body>
</html>
