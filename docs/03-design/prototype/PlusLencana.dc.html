<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lencana Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,open_in_new,payments,photo_camera,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><a class="tk-iconbtn" href="Main.dc.html" aria-label="{{t.back}}"><span class="tk-icon">arrow_back</span></a><h1 class="tk-topbar__title">{{t.title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 20px; padding: 0 16px 32px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section class="tk-section">
        <div class="tk-section__head"><h2 class="tk-section__title">{{g.title}}</h2></div>
        <p class="tk-t-body-sm tk-ink-2" style="margin: -4px 4px 8px">{{g.note}}</p>
        <div class="tk-list tk-list--icon">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div class="tk-row tk-row--compact tk-row--wrap"><span class="tk-icon tk-ink-2" aria-hidden="true">{{r.icon}}</span><span class="tk-row__main"><span class="tk-row__title">{{r.title}}</span><span class="tk-row__sub">{{r.sub}}</span></span><sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{true}}"><span class="{{r.badgeCls}}"><span class="tk-icon" aria-hidden="true">workspace_premium</span>{{r.badge}}</span></sc-if></div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? {
      back: 'Back', title: 'Plus badge', plus: 'Plus',
      g: [['Free', 'The badge marks a feature that belongs to Plus. Tapping it opens the paywall or the locked card.', 'tk-badge tk-badge--plus'], ['Trial', 'The badge is outlined: it is included now, until the trial ends.', 'tk-badge tk-badge--plus-trial'], ['Plus', 'No badge. Plus features look like any other feature.', '']],
      rows: [['notifications', 'Auto-record', 'Recurring items with a fixed amount'], ['inbox', 'Second notification app', 'Beyond your first app'], ['edit_note', 'Second budget template', 'You keep the one you have']]
    } : {
      back: 'Kembali', title: 'Lencana Plus', plus: 'Plus',
      g: [['Gratis', 'Lencana menandai fitur milik Plus. Diketuk, membuka paywall atau kartu terkunci.', 'tk-badge tk-badge--plus'], ['Uji coba', 'Lencana berbingkai: fitur ini ikut selama uji coba, sampai uji coba berakhir.', 'tk-badge tk-badge--plus-trial'], ['Plus', 'Tanpa lencana. Fitur Plus tampil seperti fitur lainnya.', '']],
      rows: [['notifications', 'Catat otomatis', 'Rutin bernominal tetap'], ['inbox', 'Aplikasi notifikasi kedua', 'Di luar aplikasi pertamamu'], ['edit_note', 'Template anggaran kedua', 'Yang sudah ada tetap dipakai']]
    };
    return {
      theme: this.props.dark ? 'dark' : 'light', t: T,
      groups: T.g.map((g) => ({ title: g[0], note: g[1], rows: T.rows.map((r) => ({ icon: r[0], title: r[1], sub: r[2], hasBadge: !!g[2], badgeCls: g[2], badge: T.plus })) }))
    };
  }
}
</script>
</body>
</html>
