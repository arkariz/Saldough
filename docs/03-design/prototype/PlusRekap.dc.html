<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rekap nilai Plus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,open_in_new,payments,photo_camera,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar"><h1 class="tk-topbar__title">{{t.home}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 12px; padding: 0 16px 32px">
    <div class="tk-recap" role="region" aria-label="{{t.title}}">
      <div class="tk-recap__head"><span class="tk-tile tk-tile--sm tk-tile--brandsoft" aria-hidden="true"><span class="tk-icon">workspace_premium</span></span><div style="display: flex; flex-direction: column"><h2 class="tk-recap__title">{{t.title}}</h2><span class="tk-t-body-sm tk-ink-2">{{t.since}}</span></div></div>
      <ul class="tk-recap__rows">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><li class="tk-recap__row"><span class="tk-recap__n">{{r.n}}</span><span>{{r.text}}</span></li></sc-for>
      </ul>
      <div class="tk-ctx__actions"><button class="tk-btn tk-btn--text tk-btn--sm" type="button">{{t.later}}</button><a class="tk-btn tk-btn--primary tk-btn--sm" href="Paywall.dc.html">{{t.see}}</a></div>
    </div>
    <div class="tk-card" style="display: flex; flex-direction: column; gap: 4px"><span class="tk-t-body-sm tk-ink-2">{{t.total}}</span><span class="tk-amt tk-t-amount-hero">Rp27.522.000</span></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"isi":{"editor":"enum","options":["banyak","sedikit"],"default":"banyak","section":"Keadaan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? {
      home: 'Home', total: 'Total balance', title: 'Plus ends on 24 Nov', since: 'Since 1 Nov, Tanuki has:', later: 'Not now', see: 'See Plus',
      many: [[14, 'entries from photos and notifications'], [3, 'recurring bills recorded by themselves'], [4, 'Watcher warnings'], [6, 'questions answered']],
      few: [[1, 'entry from a photo'], [2, 'Watcher warnings']]
    } : {
      home: 'Beranda', total: 'Total saldo', title: 'Plus berakhir 24 Nov', since: 'Sejak 1 Nov, Tanuki sudah:', later: 'Nanti saja', see: 'Lihat Plus',
      many: [[14, 'catatan dari foto dan notifikasi'], [3, 'tagihan rutin tercatat sendiri'], [4, 'peringatan Penjaga'], [6, 'pertanyaan terjawab']],
      few: [[1, 'catatan dari foto'], [2, 'peringatan Penjaga']]
    };
    const rows = (this.props.isi === 'sedikit' ? T.few : T.many).map((r) => ({ n: r[0], text: r[1] }));
    return { theme: this.props.dark ? 'dark' : 'light', t: T, rows: rows };
  }
}
</script>
</body>
</html>
