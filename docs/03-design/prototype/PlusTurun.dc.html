<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Turun ke Gratis</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,arrow_downward,arrow_upward,backspace,backup,bolt,calendar_today,chat_bubble,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,event_busy,expand_less,expand_more,family_restroom,home,hourglass_top,inbox,info,label,label_off,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,notifications_active,open_in_new,payments,photo_camera,progress_activity,radio_button_unchecked,receipt_long,redeem,restart_alt,restaurant,restore,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,summarize,swap_horiz,system_update,task_alt,translate,trending_up,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,wifi_off,work,workspace_premium&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar"><h1 class="tk-topbar__title">{{t.title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 16px">
    <p class="tk-t-body" style="margin: 0 4px">{{t.intro}}</p>
    <section class="tk-section"><div class="tk-section__head"><h2 class="tk-section__title">{{t.keepTitle}}</h2></div>
      <div class="tk-list"><ul class="tk-keep">
        <sc-for list="{{keep}}" as="k" hint-placeholder-count="3"><li class="tk-keep__item"><span class="tk-icon" aria-hidden="true">check_circle</span><span class="tk-keep__main"><span class="tk-keep__strong">{{k.title}}</span><span class="tk-t-body-sm tk-ink-2">{{k.sub}}</span></span></li></sc-for>
      </ul></div>
    </section>
    <section class="tk-section"><div class="tk-section__head"><h2 class="tk-section__title">{{t.changeTitle}}</h2></div>
      <div class="tk-list"><ul class="tk-keep is-change">
        <sc-for list="{{change}}" as="k" hint-placeholder-count="4"><li class="tk-keep__item"><span class="tk-icon" aria-hidden="true">{{k.icon}}</span><span class="tk-keep__main"><span class="tk-keep__strong">{{k.title}}</span><span class="tk-t-body-sm tk-ink-2">{{k.sub}}</span></span></li></sc-for>
      </ul></div>
    </section>
    <sc-if value="{{hasDeal}}" hint-placeholder-val="{{true}}">
      <div class="tk-deal" role="region" aria-label="{{t.dealKicker}}">
        <span class="tk-deal__kicker">{{t.dealKicker}}</span>
        <span class="tk-deal__price">{{t.dealPrice}}</span>
        <span class="tk-deal__line">{{t.dealLine}}</span>
        <span class="tk-deal__line tk-ink-2">{{t.dealFine}}</span>
      </div>
    </sc-if>
  </main>
  <div class="tk-sticky-action" style="display: flex; flex-direction: column; gap: 8px">
    <a class="tk-btn tk-btn--primary tk-btn--block" href="Paywall.dc.html?penawaran=pasca">{{ctaPlus}}</a>
    <a class="tk-btn tk-btn--secondary tk-btn--block" href="Main.dc.html">{{t.free}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"penawaran":{"editor":"enum","options":["ada","tidak"],"default":"ada","section":"Keadaan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const T = en ? {
      title: 'Your Plus trial ended', intro: 'Thanks for trying it. Everything you recorded stays, and you keep recording for free.', keepTitle: 'What stays', changeTitle: 'What changes',
      keep: [['All your entries', 'Nothing is deleted or locked'], ['Reports you opened', 'You can still open and share them'], ['Recording, History, Wallets, Budgets, recurring', 'Same as before']],
      change: [['inbox', 'Notification apps', '3 apps become 1 app of your choice'], ['bolt', 'Auto-record', '4 recurring items go back to one-tap confirmation; your settings are kept'], ['donut_small', 'Analysis', 'Your latest 6 periods; History stays complete'], ['work', 'Templates and projects', 'Your 2 templates and 3 projects keep working; new ones are limited']],
      dealKicker: 'Offer until 26 Nov, 9:00 pm', dealPrice: 'Rp129,000', dealLine: 'for the first year, then Rp179,000 a year.', dealFine: 'Renews automatically. Cancel anytime in the Play Store.',
      plus: 'Continue with Plus', plusNoDeal: 'See Plus', free: 'Continue with Free'
    } : {
      title: 'Uji coba Plus selesai', intro: 'Terima kasih sudah mencoba. Semua yang kamu catat tetap ada, dan kamu tetap mencatat gratis.', keepTitle: 'Yang tetap', changeTitle: 'Yang berubah',
      keep: [['Semua catatanmu', 'Tidak ada yang dihapus atau dikunci'], ['Rapor yang sudah kamu buka', 'Tetap bisa dibuka dan dibagikan'], ['Pencatatan, Riwayat, Dompet, Anggaran, rutin', 'Sama seperti sebelumnya']],
      change: [['inbox', 'Aplikasi notifikasi', '3 aplikasi menjadi 1 aplikasi pilihanmu'], ['bolt', 'Catat otomatis', '4 rutin kembali ke konfirmasi satu ketuk; setelannya disimpan'], ['donut_small', 'Analisis', '6 periode terakhir; Riwayat tetap lengkap'], ['work', 'Template dan proyek', '2 template dan 3 proyekmu tetap bisa dipakai; membuat yang baru dibatasi']],
      dealKicker: 'Penawaran sampai 26 Nov, 21.00', dealPrice: 'Rp129.000', dealLine: 'untuk tahun pertama, lalu Rp179.000 per tahun.', dealFine: 'Diperpanjang otomatis. Batalkan kapan saja di Play Store.',
      plus: 'Lanjutkan dengan Plus', plusNoDeal: 'Lihat Plus', free: 'Lanjut dengan Gratis'
    };
    const deal = this.props.penawaran !== 'tidak';
    return {
      theme: this.props.dark ? 'dark' : 'light', t: T, hasDeal: deal, ctaPlus: deal ? T.plus : T.plusNoDeal,
      keep: T.keep.map((k) => ({ title: k[0], sub: k[1] })), change: T.change.map((k) => ({ icon: k[0], title: k[1], sub: k[2] }))
    };
  }
}
</script>
</body>
</html>
