<!doctype html>

<meta charset="utf-8">

<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,alarm,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><h1 class="tk-topbar__title" style="padding-left: 12px">{{title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 32px">
    <p class="tk-t-body-sm tk-ink-2">{{intro}}</p>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <section style="display: flex; flex-direction: column; gap: 8px; flex: none">
        <p class="tk-t-label-sm tk-ink-2">{{g.cap}}</p>
        <div class="tk-card tk-inbox {{g.ib.cls}}" role="status" style="flex: none">
        <div class="tk-inbox__head">
          <span class="tk-tile {{g.ib.tile}}"><span class="tk-icon">inbox</span></span>
          <span class="tk-nudge__text"><span class="tk-nudge__title">{{g.ib.title}}</span><span class="tk-nudge__sub">{{g.ib.sub}}</span></span>
          <sc-if value="{{g.ib.hasCta}}" hint-placeholder-val="{{true}}"><a class="{{g.ib.ctaCls}}" href="{{g.ib.ctaHref}}" aria-label="{{g.ib.ctaAria}}">{{g.ib.cta}}</a></sc-if>
        </div>
        <sc-if value="{{g.ib.items}}" hint-placeholder-val="{{false}}">
          <div class="tk-inbox__item">
            <span class="tk-tile tk-tile--app tk-tile--sm">BCA</span>
            <span class="tk-row__main"><span class="tk-row__title">QRIS Toko Sinar Jaya</span><span class="tk-row__sub">BCA mobile · 10.42</span></span>
            <span class="tk-amt tk-t-amount">−Rp125.000</span>
          </div>
          <div class="tk-inbox__item tk-inbox__item--unknown">
            <span class="tk-tile tk-tile--app tk-tile--sm">BCA</span>
            <span class="tk-row__main"><span class="tk-row__title">Transfer masuk dari ANDI PRATAMA</span><span class="tk-row__sub">{{g.ib.unreadable}}</span></span>
            <a class="tk-btn tk-btn--secondary tk-btn--sm" href="KotakMasuk.dc.html">{{g.ib.teach}}</a>
          </div>
        </sc-if>
        <sc-if value="{{g.ib.manage}}" hint-placeholder-val="{{false}}">
          <div class="tk-inbox__foot">
            <sc-if value="{{g.ib.hasCap}}" hint-placeholder-val="{{false}}"><span class="tk-inbox__cap">{{g.ib.cap}}</span></sc-if>
            <a class="tk-link" href="Akun.dc.html">{{g.ib.manageText}}<span class="tk-icon tk-icon--sm">chevron_right</span></a>
          </div>
        </sc-if>
      </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>

const inboxState = (t, k) => {
  const P = 'tk-btn tk-btn--primary tk-btn--sm', O = 'tk-btn tk-btn--sm tk-btn--on-soft';
  const base = { title: t.inboxTitle, unreadable: t.unreadable, teach: t.teach, manageText: t.manageSources, items: false, manage: false, hasCap: false, cap: '', hasCta: true,
    cls: 'tk-inbox--calm', tile: 'tk-tile--brandsoft' };
  if (k === 'belum') return Object.assign(base, { sub: t.nzBody, cta: t.turnOn, ctaCls: P, ctaHref: 'MulaiCepat.dc.html', ctaAria: t.nzBtnTitle });
  if (k === 'izin') return Object.assign(base, { sub: t.st.perm, cta: t.allow, ctaCls: P, ctaHref: 'Akun.dc.html', ctaAria: t.allow + ': ' + t.nzManage });
  if (k === 'mati') return Object.assign(base, { sub: t.st.off, cta: t.turnOn, ctaCls: P, ctaHref: 'Akun.dc.html', ctaAria: t.nzBtnTitle });
  if (k === 'aktifKosong') return Object.assign(base, { sub: t.nzActive.replace('{n}', '2'), hasCta: false, cta: '', ctaCls: '', ctaHref: '#', ctaAria: '', manage: true });
  // aktif dengan tangkapan menunggu
  return Object.assign(base, { cls: '', tile: 'tk-tile--amber', sub: t.inboxBody, cta: t.check, ctaCls: O, ctaHref: 'KotakMasuk.dc.html', ctaAria: t.inboxTitle,
    items: true, manage: true, hasCap: true, cap: t.nzActive.replace('{n}', '2') });
};

class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = S[en ? 'en' : 'id'];
    const cap = en
      ? { belum: 'Not set up', izin: 'Permission missing', mati: 'Switched off', aktifKosong: 'Active, nothing waiting', aktif: 'Active, items waiting' }
      : { belum: 'Belum disetel', izin: 'Izin hilang', mati: 'Sakelar mati', aktifKosong: 'Aktif, tidak ada yang menunggu', aktif: 'Aktif, ada yang menunggu' };
    return {
      theme: this.props.dark ? 'dark' : 'light',
      title: en ? 'Notification inbox, states' : 'Kotak masuk notifikasi, keadaan',
      intro: en ? 'One widget on Home (Android). It never goes away; it changes with the state.' : 'Satu widget di Beranda (Android). Tidak pernah hilang; isinya berubah menurut keadaan.',
      groups: ['belum', 'izin', 'mati', 'aktifKosong', 'aktif'].map((k) => ({ cap: cap[k], ib: inboxState(t, k) }))
    };
  }
}
</script>
</body>
</html>
