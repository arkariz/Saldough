<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub"><h1 class="tk-topbar__title" style="padding-left: 12px">{{title}}</h1></header>
  <main class="tk-body tk-scroll" style="gap: 16px; padding: 0 16px 32px">
    <p class="tk-t-body-sm tk-ink-2">{{intro}}</p>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px; flex: none">
        <p class="tk-t-label-sm tk-ink-2">{{g.cap}}</p>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
        <sc-if value="{{r.isBtn}}" hint-placeholder-val="{{true}}">
          <div class="tk-card tk-nudge">
            <span class="tk-tile tk-tile--brandsoft"><span class="tk-icon">{{r.icon}}</span></span>
            <span class="tk-nudge__text"><span class="tk-nudge__title">{{r.title}}</span><span class="tk-nudge__sub">{{r.sub}}</span></span>
            <sc-if value="{{r.hasHref}}" hint-placeholder-val="{{false}}"><a class="{{r.btnCls}}" href="{{r.href}}" aria-label="{{r.aria}}">{{r.btn}}</a></sc-if>
            <sc-if value="{{r.noHref}}" hint-placeholder-val="{{true}}"><button class="{{r.btnCls}}" type="button" aria-label="{{r.aria}}" onClick="{{r.act}}">{{r.btn}}</button></sc-if>
          </div>
        </sc-if>
        <sc-if value="{{r.isLink}}" hint-placeholder-val="{{false}}">
          <a class="tk-card tk-nudge" href="{{r.href}}">
            <span class="tk-tile tk-tile--brandsoft"><span class="tk-icon">{{r.icon}}</span></span>
            <span class="tk-nudge__text"><span class="tk-nudge__title">{{r.title}}</span><span class="tk-nudge__sub">{{r.sub}}</span></span>
            <span class="tk-icon tk-ink-2">chevron_right</span>
          </a>
        </sc-if>
      </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>

const rowsFor = (t, kind) => {
  const P = 'tk-btn tk-btn--primary tk-btn--sm', Sx = 'tk-btn tk-btn--secondary tk-btn--sm';
  const nz = (title, sub, btn) => ({ isBtn: true, icon: 'notifications', title: title, sub: sub, btn: btn, btnCls: P, hasHref: false, noHref: true, aria: title, act: () => {} });
  if (kind === 'belum') return [nz(t.nzBtnTitle, t.nzBody, t.turnOn)];
  if (kind === 'aktif') return [{ isLink: true, icon: 'notifications', title: t.nzManage, sub: t.nzActive.replace('{n}', '2'), href: '#' }];
  if (kind === 'izin') return [nz(t.nzManage, t.st.perm, t.allow)];
  if (kind === 'mati') return [nz(t.nzManage, t.st.off, t.turnOn)];
  if (kind === 'ingat') return [{ isBtn: true, icon: 'alarm', title: t.rmBtnTitle, sub: t.rmBody, btn: t.turnOn, btnCls: Sx, hasHref: false, noHref: true, aria: t.rmBtnTitle, act: () => {} }];
  return [{ isBtn: true, icon: 'alarm', title: t.rowRem, sub: t.st.perm, btn: t.allow, btnCls: Sx, hasHref: false, noHref: true, aria: t.rowRem, act: () => {} }];
};
class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = S[en ? 'en' : 'id'];
    return {
      theme: this.props.dark ? 'dark' : 'light', title: t.title.nudge, intro: t.intro.nudge,
      groups: ['belum', 'aktif', 'izin', 'mati', 'ingat', 'ingatIzin'].map((k) => ({ cap: t.cap[k], rows: rowsFor(t, k) }))
    };
  }
}
