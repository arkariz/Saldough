<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Versi aplikasi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tanukonomy/components/bundle.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_balance_wallet,account_circle,add,arrow_back,backspace,bolt,calendar_today,check,check_circle,chevron_left,chevron_right,close,credit_card,dark_mode,delete,donut_small,edit,edit_note,error,expand_more,family_restroom,home,hourglass_top,inbox,info,label,local_cafe,lock,logout,medical_services,mic,more_horiz,more_vert,notifications,payments,progress_activity,receipt_long,redeem,restart_alt,restaurant,savings,schedule,school,search,shopping_bag,shopping_cart,sports_esports,stars,sticky_note_2,swap_horiz,system_update,task_alt,translate,tune,two_wheeler,undo,visibility,visibility_off,volunteer_activism,warning,wifi,work&display=block">
<style>
body{margin:0}
</style>
</helmet>
<div class="tk tk-screen" data-theme="{{theme}}" style="width: 360px; height: 800px; font-family: 'Plus Jakarta Sans', Roboto, sans-serif; color: var(--ink); background: var(--bg)">
  <header class="tk-topbar tk-topbar--sub">
    <a class="tk-iconbtn" href="Akun.dc.html" aria-label="{{back}}"><span class="tk-icon">arrow_back</span></a>
    <h1 class="tk-topbar__title">{{label}}</h1>
  </header>

  <main class="tk-body tk-scroll" style="gap: 24px; padding: 0 16px 32px">
    <div class="tk-card" style="display: flex; align-items: center; gap: 12px" aria-live="polite">
      <span class="tk-tile tk-tile--lg tk-tile--brandsoft"><span class="{{iconCls}}">{{icon}}</span></span>
      <div class="tk-stat">
        <span class="tk-t-title">{{value}}</span>
        <sc-if value="{{hasStatus}}" hint-placeholder-val="{{true}}"><span class="tk-t-body-sm tk-ink-2">{{status}}</span></sc-if>
      </div>
    </div>

    <section class="tk-section">
      <div class="tk-section__head"><h2 class="tk-section__title">{{wnTitle}}</h2></div>
      <sc-if value="{{hasNotes}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
            <div class="tk-card tk-notes__group">
              <h3 class="tk-notes__head">{{g.head}}</h3>
              <ul class="tk-notes__list">
                <sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
                  <li class="tk-note">
                    <span class="tk-tile {{n.tile}}"><span class="tk-tile__emoji" aria-hidden="true">{{n.emoji}}</span></span>
                    <div class="tk-note__body"><span class="{{n.tagCls}}">{{n.tag}}</span><span class="tk-note__text">{{n.text}}</span></div>
                  </li>
                </sc-for>
              </ul>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <div class="tk-empty">
          <span class="tk-tile tk-tile--lg tk-tile--brandsoft"><span class="tk-icon">sticky_note_2</span></span>
          <p class="tk-empty__body">{{emptyText}}</p>
        </div>
      </sc-if>
    </section>
  </main>

  <sc-if value="{{hasAction}}" hint-placeholder-val="{{true}}">
    <div class="tk-sticky-action">
      <button class="tk-btn tk-btn--primary tk-btn--block" type="button" onClick="{{act}}">{{actLabel}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"keadaan":{"editor":"enum","options":["terbaru","tersedia","mengunduh","diunduh","kecil","tidak"],"default":"tersedia","section":"Keadaan"},"kosong":{"editor":"boolean","default":false,"section":"Keadaan"},"dark":{"editor":"boolean","default":false,"section":"Tampilan"},"en":{"editor":"boolean","default":false,"section":"Tampilan"},"$preview":{"width":360,"height":800}}'>

   },

  },

 },

 },

  {

 ]
};
const T = (en) => D.ui[en ? 'en' : 'id'];
const ver = (r, en) => r.v + ' (' + r.b + ')' + (r.p ? ', ' + T(en).patch + ' ' + r.p : '');
const notesOf = (r, en) => r.notes.map((n) => ({ c: D.cats[n[0]].c, emoji: D.cats[n[0]].emoji, tag: D.cats[n[0]][en ? 'en' : 'id'], text: n[en ? 2 : 1] }));
const rel = (v, b, p) => D.releases.filter((r) => r.v === v && r.b === b && r.p === p)[0];

class Component extends DCLogic {
  renderVals() {
    const en = !!this.props.en;
    const t = T(en);
    const k = (this.state && this.state.k) || this.props.keadaan || 'tersedia';
    const cur = rel('0.6.0', 7, 1), pre = rel('0.5.0', 6, 0), mid = rel('0.6.0', 7, 0);
    // Versi yang berjalan menurut keadaan (S1: terpasang 0.5.0 (6), 0.6.0 (7) menunggu)
    const running = k === 'terbaru' || k === 'tidak' ? cur : (k === 'kecil' ? mid : pre);
    // catatan yang sudah terpasang, terbaru di atas
    const all = [rel('0.6.0', 7, 1), rel('0.6.0', 7, 0), rel('0.5.0', 6, 0)];
    const shown = all.filter((r) => r.b < running.b || (r.b === running.b && r.p <= running.p));
    const empty = !!this.props.kosong;
    const icon = { terbaru: 'check_circle', tersedia: 'system_update', mengunduh: 'progress_activity', diunduh: 'system_update', kecil: 'restart_alt', tidak: 'info' }[k];
    const hasAction = k === 'tersedia' || k === 'diunduh';
    return {
      theme: this.props.dark ? 'dark' : 'light',
      back: t.back, label: t.verLabel,
      value: ver(running, en), status: t.st[k], hasStatus: !!t.st[k],
      icon: icon, iconCls: 'tk-icon' + (k === 'mengunduh' ? ' tk-icon--spin' : ''),
      wnTitle: t.wnTitlePatch,
      hasNotes: !empty, empty: empty, emptyText: t.wnEmpty,
      groups: shown.map((r) => ({ head: ver(r, en), items: notesOf(r, en).map((n) => Object.assign({}, n, { tile: 'tk-tile--' + n.c, tagCls: 'tk-tag tk-tag--' + n.c })) })),
      hasAction: hasAction,
      actLabel: k === 'diunduh' ? t.act.install : t.act.update,
      act: () => {
        if (k === 'tersedia') {
          this.setState({ k: 'mengunduh' });
          setTimeout(() => this.setState({ k: 'diunduh' }), 2400);
        } else {
          this.setState({ k: 'terbaru' });
        }
      }
    };
  }
}
</script>
</body>
</html>
