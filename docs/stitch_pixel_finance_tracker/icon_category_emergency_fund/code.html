<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Emergency Fund Icon: Voxel Lifebuoy / Rescue Ring with Emerald Heart Core -->
  <!-- Outer Ring Outline -->
  <rect x="6" y="6" width="20" height="20" fill="#1e1e1e"/>
  <!-- Inner Ring Hole -->
  <rect x="11" y="11" width="10" height="10" fill="#1e1e1e"/>
  <rect x="12" y="12" width="8" height="8" fill="none"/>
  <!-- Ring Quadrants: Alternating Terracotta-Red and Clean Cream-White -->
  <!-- Top and Bottom: White Segments -->
  <rect x="7" y="7" width="18" height="5" fill="#ef4444"/>
  <rect x="7" y="20" width="18" height="5" fill="#ef4444"/>
  <rect x="7" y="12" width="5" height="8" fill="#fff8f5"/>
  <rect x="20" y="12" width="5" height="8" fill="#fff8f5"/>
  <!-- Corner highlights -->
  <rect x="11" y="7" width="10" height="5" fill="#fca5a5"/>
  <rect x="11" y="20" width="10" height="5" fill="#dc2626"/>
  <!-- Rope Wraps (Navy Slate Bands) -->
  <rect x="10" y="6" width="2" height="6" fill="#1e1e1e"/>
  <rect x="20" y="6" width="2" height="6" fill="#1e1e1e"/>
  <rect x="10" y="20" width="2" height="6" fill="#1e1e1e"/>
  <rect x="20" y="20" width="2" height="6" fill="#1e1e1e"/>
  <!-- Heart Emblem floating in center hole (Care / Protection) -->
  <rect x="14" y="14" width="4" height="4" fill="#10b981"/>
  <rect x="13" y="14" width="6" height="2" fill="#10b981"/>
  <rect x="15" y="17" width="2" height="1" fill="#10b981"/>
</svg>
