<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Developer / Coding Laptop Icon: Open Laptop with Code Brackets -->
  <!-- Laptop Screen Lid -->
  <rect x="6" y="6" width="20" height="15" fill="#1e1e1e"/>
  <rect x="7" y="7" width="18" height="13" fill="#0f172a"/>
  <!-- Screen Bezel Highlight -->
  <rect x="7" y="7" width="18" height="1" fill="#334155"/>
  <!-- Code Symbols on Screen: Emerald < / > Brackets -->
  <!-- Left Bracket < -->
  <rect x="10" y="11" width="2" height="2" fill="#10b981"/>
  <rect x="12" y="9" width="2" height="2" fill="#10b981"/>
  <rect x="12" y="13" width="2" height="2" fill="#10b981"/>
  <!-- Right Bracket > -->
  <rect x="20" y="11" width="2" height="2" fill="#10b981"/>
  <rect x="18" y="9" width="2" height="2" fill="#10b981"/>
  <rect x="18" y="13" width="2" height="2" fill="#10b981"/>
  <!-- Center Slash / Cursor -->
  <rect x="15" y="10" width="2" height="4" fill="#38bdf8"/>
  <!-- Laptop Keyboard Base (Slate) -->
  <rect x="4" y="21" width="24" height="4" fill="#1e1e1e"/>
  <rect x="5" y="21" width="22" height="3" fill="#64748b"/>
  <rect x="5" y="21" width="22" height="1" fill="#94a3b8"/>
  <!-- Trackpad Notch -->
  <rect x="13" y="22" width="6" height="2" fill="#334155"/>
</svg>
