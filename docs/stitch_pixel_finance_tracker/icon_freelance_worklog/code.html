<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Freelance / Worklog Icon: Notebook with Clock Widget -->
  <!-- Notebook Base (Dark Emerald Cover) -->
  <rect x="5" y="6" width="16" height="21" fill="#1e1e1e"/>
  <rect x="6" y="7" width="14" height="19" fill="#047857"/>
  <rect x="5" y="6" width="3" height="21" fill="#064e3b"/>
  <!-- Spiral Bindings -->
  <rect x="7" y="9" width="2" height="2" fill="#cbd5e1"/>
  <rect x="7" y="14" width="2" height="2" fill="#cbd5e1"/>
  <rect x="7" y="19" width="2" height="2" fill="#cbd5e1"/>
  <!-- Notebook Page Lines -->
  <rect x="10" y="10" width="7" height="1" fill="#34d399"/>
  <rect x="10" y="13" width="5" height="1" fill="#34d399"/>
  <!-- Clock Overlay Widget at Lower Right -->
  <rect x="15" y="15" width="12" height="12" fill="#1e1e1e"/>
  <rect x="16" y="16" width="10" height="10" fill="#fff8f5"/>
  <rect x="17" y="16" width="8" height="1" fill="#fef08a"/>
  <!-- Clock Rim / Bezel Accent -->
  <rect x="16" y="16" width="1" height="10" fill="#e0d8d5"/>
  <rect x="25" y="16" width="1" height="10" fill="#e0d8d5"/>
  <rect x="16" y="25" width="10" height="1" fill="#cbd5e1"/>
  <!-- Clock Hands (Showing 3:00 / Time tracked) -->
  <rect x="20" y="18" width="2" height="4" fill="#ea580c"/>
  <rect x="20" y="20" width="4" height="2" fill="#ea580c"/>
  <rect x="20" y="20" width="2" height="2" fill="#1e1e1e"/>
</svg>
