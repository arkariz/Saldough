<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Refund Icon: U-Turn / Curved Return Arrow bringing Gold Coin back -->
  <!-- Circular Return Arrow (Cyan / Emerald Teal) -->
  <rect x="9" y="6" width="13" height="3" fill="#1e1e1e"/>
  <rect x="10" y="7" width="11" height="1" fill="#06b6d4"/>
  <!-- Top Right Curve -->
  <rect x="21" y="7" width="4" height="10" fill="#1e1e1e"/>
  <rect x="22" y="8" width="2" height="8" fill="#0891b2"/>
  <!-- Bottom return bar -->
  <rect x="13" y="16" width="10" height="3" fill="#1e1e1e"/>
  <rect x="14" y="17" width="8" height="1" fill="#06b6d4"/>
  <!-- Arrow Head pointing Left (Return) -->
  <rect x="10" y="14" width="4" height="7" fill="#1e1e1e"/>
  <rect x="8" y="16" width="4" height="3" fill="#1e1e1e"/>
  <rect x="7" y="17" width="2" height="1" fill="#1e1e1e"/>
  <!-- Arrow Head fill -->
  <rect x="11" y="15" width="2" height="5" fill="#22d3ee"/>
  <rect x="9" y="17" width="2" height="1" fill="#67e8f9"/>
  <!-- Returned Gold Coin resting at arrow destination -->
  <rect x="4" y="19" width="8" height="7" fill="#1e1e1e"/>
  <rect x="5" y="20" width="6" height="5" fill="#facc15"/>
  <rect x="6" y="20" width="4" height="2" fill="#fef08a"/>
  <rect x="7" y="22" width="2" height="2" fill="#ca8a04"/>
  <!-- Small plus badge on coin -->
  <rect x="10" y="22" width="3" height="1" fill="#10b981"/>
  <rect x="11" y="21" width="1" height="3" fill="#10b981"/>
</svg>
