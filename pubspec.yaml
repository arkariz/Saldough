name: saldough
description: Pencatatan dan pengelolaan keuangan pribadi — dompet, transaksi, dan anggaran.
publish_to: none
version: 0.2.0+3

environment:
  # ^3.12.0 (bukan ^3.11.4 seperti bawaan `flutter create`): constructor
  # `required this._field` (parameter bernama publik ke field privat)
  # butuh fitur bahasa `private-named-parameters`, baru ada dari 3.12.0.
  sdk: ^3.12.0

dependencies:
  # Paket internal — dipin ke commit SHA pada branch kompatibilitas
  # `claude/saldough-flutter-finance-app-06ufsv` di advance-mobile-platform
  # untuk api_storage/models/state_management/hive_storage, karena tag
  # aslinya menunjuk commit lama yang isinya masih mereferensikan paket
  # sibling lewat URL GitLab privat. Paket lain (dependencies/di/failures/
  # navigation) tidak pernah rusak (tidak punya dependensi internal di blok
  # `dependencies:` regulernya) sehingga tetap dipin ke tag asli.
  # `resolution: workspace` pada paket-paket ini TIDAK dihapus — tetap
  # dipakai melos untuk pengembangan internal. Lihat ADR-0001 dan
  # TASK_LIST.md Fase 0 untuk detail diagnosisnya.
  api_storage:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: infrastructure/storage/api_storage
      ref: 275181ec7d43d423d5293ab676445a4e43a736ee  # api_storage-v1.1.0 + fix URL
  dependencies:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: shared/dependencies
      ref: dependencies-v1.4.0
  di:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: shared/di
      ref: di-v1.1.2
  failures:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: core/failures
      ref: failures-v2.0.2
  # ADR-023: identitas opsional, analitik, dan crash reporting. Pertama
  # kalinya aplikasi memanggil jaringan -- lihat NFR-SEC-001/NFR-REL-001
  # hasil revisi 28 Sep 2026 dan `android/app/google-services.json`
  # (ditaruh manual oleh pemilik, tidak dibuat lewat kode).
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  hive_storage:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: infrastructure/storage/hive_storage
      ref: 9b96fb4353f913270f72518198e598e900d6646c  # hive_storage-v1.1.1 + fix URL + fix ref api_storage
  intl: ^0.20.2
  models:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: core/models
      ref: 275181ec7d43d423d5293ab676445a4e43a736ee  # models-v1.1.3 + fix URL
  navigation:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: fondation/navigation
      ref: navigation-v1.1.1
  slang: ^4.7.0
  slang_flutter: ^4.7.0
  state_management:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: fondation/state_management
      ref: 275181ec7d43d423d5293ab676445a4e43a736ee  # state_management-v2.2.0 + fix URL

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: any
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  injectable_generator: any
  json_serializable: any
  linter:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: shared/linter
      ref: linter-v1.0.2
  memory_storage:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: infrastructure/storage/memory_storage
      ref: 9b96fb4353f913270f72518198e598e900d6646c  # memory_storage-v1.1.1 + fix URL + fix ref api_storage
  mocktail: ^1.0.4
  slang_build_runner: ^4.7.0

# Ikon peluncur dan splash screen Android, dari maskot tanuki (ADR-015).
# `assets/icon/` sengaja TIDAK didaftarkan di `flutter: assets:` di bawah --
# berkasnya hanya sumber untuk dua generator ini saat `dart run ...`, bukan
# aset yang dibundel ke aplikasi. Hanya Android yang disasar (`ios: false`);
# ikon iOS menyusul di T-8.3 (ganti nama) karena butuh artwork tanpa
# transparansi terpisah. Jalankan ulang setelah artwork/warna berubah:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/legacy.png"
  adaptive_icon_background: "#BD5D41"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#FFF8F5" # colors.background mode terang (app_colors_extension.dart)
  color_dark: "#231F1B" # colors.background mode gelap
  image: "assets/icon/splash.png"
  image_dark: "assets/icon/splash.png"
  android: true
  ios: false
  web: false
  android_12:
    image: "assets/icon/splash_android12.png"
    image_dark: "assets/icon/splash_android12.png"
    icon_background_color: "#BD5D41"
    icon_background_color_dark: "#BD5D41"
    color: "#FFF8F5"
    color_dark: "#231F1B"

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/icons/
    - assets/illustration/
    - assets/fonts/licenses/
    - shorebird.yaml
  # Font ADR-015 dibundel lokal, bukan diambil lewat `google_fonts` saat
  # runtime -- render UI dasar tidak boleh bergantung koneksi first-run,
  # terlepas dari fitur online lain yang sedang direncanakan (CLAUDE.md
  # "Status"). Hanya bobot yang benar-benar dipakai `PixelTheme` yang
  # didaftarkan; lihat komentar di `pixel_theme.dart`.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
